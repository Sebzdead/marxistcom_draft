<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>The Three Pillars of Marxism — Marxist.com</title>

<link rel="stylesheet" href="ds/colors_and_type.css">

<style>
  /* ────────────────────────────────────────────────────────────
     Marxist.com — Podcasts & Media page styling
     Print-materiality visual language:
       • paper substrate + film grain
       • ink rules, hard 2.5D offset shadows, zero-radius corners
       • Built Titling display, Cheltenham serif body, Trade Gothic eyebrows
     ──────────────────────────────────────────────────────────── */

  :root {
    --page-bg: #f6efef;
    --page-bg-dark: #181513;
    --paper: #f6efef;
    --paper-soft: #ece4e4;
    --rule: var(--rci-ink);
    --rule-soft: #b8b0ac;
  }

  html, body { margin: 0; padding: 0; }
  html { background: var(--page-bg); }
  body {
    background: var(--page-bg);
    color: var(--rci-ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    position: relative;
  }

  /* DARK MODE */
  body[data-mode="dark"] {
    background: var(--page-bg-dark);
    color: var(--rci-offwhite);
    --rule: #f0e3d8;
    --rule-soft: #4a4138;
    --paper: #221d18;
    --paper-soft: #1a1612;
    --fg: var(--rci-offwhite);
    --fg-soft: #c9c2c2;
  }

  #root { position: relative; z-index: 1; }

  .site {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 28px 64px;
  }

  /* ─── MASTHEAD ────────────────────────────────────────────── */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 22px 0 18px;
    border-bottom: 4px solid var(--rule);
    gap: 24px;
  }
  .mast-left {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
  }
  .mast-logo {
    width: 48px; height: 48px;
    display: block;
  }
  .mast-wordmark { display: flex; flex-direction: column; }
  .wm-title {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 42px;
    line-height: 0.95;
    letter-spacing: -0.01em;
    text-transform: none;
    color: var(--rci-ink);
  }
  body[data-mode="dark"] .wm-title { color: var(--rci-offwhite); }
  .wm-dot { color: var(--rci-red); }
  .mast-slash {
    font-family: var(--font-display);
    font-size: 36px;
    color: var(--rci-red);
    font-weight: 400;
    line-height: 1;
    margin: 0 4px 4px;
  }
  .mast-tag {
    font-family: var(--font-article-title);
    text-transform: uppercase;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    line-height: 0.98;
    color: var(--rci-ink);
  }
  body[data-mode="dark"] .mast-tag { color: var(--rci-offwhite); }

  .mast-right { display: flex; align-items: center; gap: 18px; }
  .mast-socials {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mast-social {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 2px solid var(--rule);
    border-radius: 50%;
    background: var(--paper);
    color: var(--rci-ink);
    text-decoration: none;
    transition: background 90ms, color 90ms, transform 90ms cubic-bezier(0.2,0.7,0.1,1);
  }
  .mast-social svg { width: 18px; height: 18px; display: block; }
  .mast-social:hover {
    background: var(--rci-red);
    color: var(--rci-offwhite);
    border-color: var(--rci-red);
  }
  .mast-social:active { transform: translate(1px, 1px); }
  @media (max-width: 720px) {
    .mast-socials { display: none; }
  }

  .mast-search {
    display: flex; align-items: center;
    height: 44px;
    background: var(--paper);
    border: 2px solid var(--rule);
    transition: border-color 120ms, background 80ms;
    overflow: hidden;
  }
  body[data-mode="dark"] .mast-search { background: var(--paper); }
  .mast-search:focus-within { border-color: var(--rci-ink); }
  .mast-search-input {
    width: 0;
    padding: 0;
    border: 0;
    background: transparent;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.01em;
    color: var(--rci-ink);
    outline: none;
    transition: width 240ms cubic-bezier(0.2,0.7,0.1,1), padding 240ms;
  }
  body[data-mode="dark"] .mast-search-input { color: var(--rci-ink); }
  .mast-search-input::placeholder { color: var(--rci-ink); opacity: 0.55; font-style: italic; }
  .mast-search[data-open="true"] .mast-search-input { width: 200px; padding: 0 4px 0 12px; }
  .mast-search-btn {
    width: 40px; height: 40px;
    flex: 0 0 40px;
    background: transparent;
    border: 0;
    padding: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--rci-ink);
    transition: background 80ms, color 80ms;
  }
  body[data-mode="dark"] .mast-search-btn { color: var(--rci-ink); }
  .mast-search-btn:hover { background: var(--rci-ink); color: var(--rci-offwhite); }
  .mast-search[data-open="true"] .mast-search-btn:hover { background: transparent; color: var(--rci-red); }
  .mast-search-btn svg { width: 18px; height: 18px; display: block; }
  .mast-search-btn:active { transform: translate(1px, 1px); }

    /* ─── NAV ─────────────────────────────────────────────────── */
  .primary-nav {
    padding: 18px 0 22px;
    border-bottom: 1px solid var(--rule-soft);
  }
  .nav-inner {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  /* ─── THEORY PORTAL SECTION ────────────────────────────────── */
  .theory-hero {
    background: var(--rci-ink);
    color: var(--rci-offwhite);
    padding: 56px 48px;
    border: 2px solid var(--rule);
    box-shadow: 6px 6px 0 var(--rule);
    margin: 28px 0 36px;
    position: relative;
    overflow: hidden;
  }
  body[data-mode="dark"] .theory-hero {
    background: var(--paper-soft);
    border-color: var(--rci-offwhite);
    box-shadow: 6px 6px 0 var(--rci-offwhite);
  }
  .theory-hero::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url("ds/textures/grunge-light-specks.jpg");
    background-size: 700px;
    mix-blend-mode: screen;
    opacity: 0.08;
    pointer-events: none;
  }
  .theory-hero-content {
    position: relative;
    z-index: 2;
    max-width: 80ch;
  }
  .theory-hero-eyebrow {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--rci-red-hot);
    margin-bottom: 12px;
    display: block;
  }
  .theory-hero-h1 {
    font-family: var(--font-display);
    font-size: clamp(38px, 5vw, 64px);
    line-height: 0.92;
    text-transform: uppercase;
    margin: 0 0 16px;
    color: var(--rci-offwhite);
    letter-spacing: -0.01em;
  }
  .theory-hero-p {
    font-family: var(--font-serif);
    font-size: 19px;
    line-height: 1.45;
    color: #e6dfdf;
    margin: 0;
  }
  body[data-mode="dark"] .theory-hero-p {
    color: var(--fg-soft);
  }
  .theory-hero-p b {
    color: var(--rci-white);
  }

  /* Filter & Search Controls */
  .theory-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    margin: 40px 0 8px;
    flex-wrap: wrap;
  }
  .theory-tabs {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .theory-search-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 2px solid var(--rule);
    background: var(--paper);
    padding: 10px 16px;
    width: 340px;
    max-width: 100%;
    box-shadow: 3px 3px 0 var(--rule);
    transition: transform 80ms, box-shadow 80ms, border-color 80ms;
  }
  .theory-search-bar:focus-within {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--rule);
  }
  body[data-mode="dark"] .theory-search-bar {
    border-color: var(--rci-offwhite);
    box-shadow: 3px 3px 0 var(--rci-offwhite);
  }
  body[data-mode="dark"] .theory-search-bar:focus-within {
    box-shadow: 4px 4px 0 var(--rci-offwhite);
  }
  .theory-search-bar svg {
    width: 18px;
    height: 18px;
    color: var(--rci-ink);
    flex-shrink: 0;
  }
  body[data-mode="dark"] .theory-search-bar svg {
    color: var(--rci-offwhite);
  }
  .theory-search-input {
    border: 0;
    background: transparent;
    outline: none;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--rci-ink);
    width: 100%;
  }
  body[data-mode="dark"] .theory-search-input {
    color: var(--rci-offwhite);
  }

  /* Grid Layouts */
  .theory-grid-section {
    margin-bottom: 48px;
  }
  .theory-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px 26px;
    margin-top: 24px;
  }
  @media (max-width: 980px) {
    .theory-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  @media (max-width: 640px) {
    .theory-grid {
      grid-template-columns: 1fr;
    }
  }

  /* 2.5D Theory Cards */
  .theory-card {
    display: flex;
    flex-direction: column;
    border: 2px solid var(--rule);
    box-shadow: 4px 4px 0 var(--rule);
    background: var(--paper);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms, border-color 90ms;
    height: 100%;
  }
  body[data-mode="dark"] .theory-card {
    border-color: var(--rci-offwhite);
    box-shadow: 4px 4px 0 var(--rci-offwhite);
  }
  .theory-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--rule);
  }
  body[data-mode="dark"] .theory-card:hover {
    box-shadow: 6px 6px 0 var(--rci-offwhite);
  }
  .theory-card-img-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: var(--rci-ink);
    border-bottom: 2px solid var(--rule);
    overflow: hidden;
  }
  body[data-mode="dark"] .theory-card-img-wrap {
    border-bottom-color: var(--rci-offwhite);
  }
  .theory-card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transition: transform 0.3s ease;
  }
  .theory-card:hover .theory-card-img {
    transform: scale(1.02);
  }
  .theory-card-img-grain {
    position: absolute; inset: 0;
    background-image: url("ds/textures/film-grain.jpg");
    background-size: cover;
    mix-blend-mode: multiply;
    opacity: 0.12;
    pointer-events: none;
  }
  .theory-card-body {
    padding: 20px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }
  .theory-card-eyebrow {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--rci-red);
    margin-bottom: 6px;
  }
  .theory-card-title {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 22px;
    line-height: 1.15;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    margin: 0 0 10px;
  }
  .theory-card-desc {
    font-family: var(--font-serif);
    font-size: 15px;
    line-height: 1.45;
    color: var(--fg-soft);
    margin: 0;
  }

  /* Empty state */
  .theory-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 20px;
    border: 2px dashed var(--rule-soft);
    font-family: var(--font-serif);
    font-size: 18px;
    color: var(--rci-ash);
  }

  /* ─── PILLAR TRIPTYCH ──────────────────────────────────────── */
  .triptych {
    margin: 44px auto 0;
    max-width: 1000px;
  }
  .triptych-architrave {
    border: 2.5px solid var(--rule);
    background: var(--paper);
    box-shadow: 5px 5px 0 var(--rule);
    text-align: center;
    padding: 14px 8px 10px;
    position: relative;
    z-index: 2;
  }
  .triptych-architrave-word {
    font-family: var(--font-display);
    font-size: clamp(22px, 3vw, 34px);
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    text-transform: uppercase;
    color: var(--fg, var(--rci-ink));
  }
  .triptych-cols {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 36px;
    padding: 0 56px;
  }
  .triptych-col {
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: transform 120ms cubic-bezier(0.2,0.7,0.1,1);
  }
  .triptych-col:hover { transform: translateY(-3px); }
  .t-capital {
    height: 12px;
    border: 2.5px solid var(--rule);
    background: var(--paper);
    margin: 0 -10px;
  }
  .t-capital--lower {
    height: 10px;
    margin: 0 4px;
    border-top: 0;
  }
  .t-shaft {
    height: 120px;
    margin: 0 18px;
    border-left: 2.5px solid var(--rule);
    border-right: 2.5px solid var(--rule);
    background-color: var(--paper);
    background-image: repeating-linear-gradient(
      90deg,
      transparent 0px, transparent 15px,
      var(--rule-soft) 15px, var(--rule-soft) 16.5px
    );
  }
  .t-base--upper {
    height: 10px;
    margin: 0 4px;
    border: 2.5px solid var(--rule);
    border-bottom: 0;
    background: var(--paper);
  }
  .t-base {
    height: 14px;
    border: 2.5px solid var(--rule);
    background: var(--paper);
    margin: 0 -10px;
  }
  .t-base--upper { margin: 0 4px; }
  .triptych-col:hover .t-capital,
  .triptych-col:hover .t-base,
  .triptych-col:hover .t-shaft { border-color: var(--rci-red); }
  .t-label {
    text-align: center;
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .t-label-numeral {
    font-family: var(--font-display);
    font-size: 30px;
    line-height: 1;
    color: var(--rci-red);
  }
  .t-label-title {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 17px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--fg, var(--rci-ink));
  }
  .triptych-col:hover .t-label-title { color: var(--rci-red); }
  .t-label-tag {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13.5px;
    color: var(--rci-ash);
  }
  @media (max-width: 800px) {
    .triptych-cols { gap: 20px; padding: 0 24px; }
    .t-shaft { height: 80px; margin: 0 10px; }
    .t-label-title { font-size: 14px; }
  }

  /* ─── START HERE STRIP ─────────────────────────────────────── */
  .start-here {
    margin: 30px auto 0;
    max-width: 880px;
    border: 2px solid var(--rule);
    background: var(--paper-soft);
    box-shadow: 4px 4px 0 var(--rule);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .start-here-label {
    font-family: var(--font-condensed);
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--rci-red);
    flex: 0 0 auto;
    padding-right: 18px;
    border-right: 2px solid var(--rule);
  }
  .start-here-links {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    flex: 1 1 auto;
  }
  .start-here-link {
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .start-here-link-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 14.5px;
    color: var(--fg, var(--rci-ink));
  }
  .start-here-link:hover .start-here-link-title {
    color: var(--rci-red);
    text-decoration: underline;
  }
  .start-here-link-author {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rci-ash);
  }
  @media (max-width: 700px) {
    .start-here-label { border-right: 0; padding-right: 0; }
  }

  /* ─── PILLAR CHAPTERS ──────────────────────────────────────── */
  .pillar-chapter {
    margin: 56px 0 64px;
    scroll-margin-top: 24px;
  }
  .chapter-head {
    border-top: 8px solid var(--rule);
    padding-top: 24px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 36px;
    align-items: start;
  }
  .chapter-numeral {
    font-family: var(--font-display);
    font-size: clamp(80px, 10vw, 140px);
    line-height: 0.8;
    color: var(--rci-red);
    text-shadow: 5px 5px 0 var(--rule);
    min-width: 96px;
    text-align: center;
    padding-top: 6px;
  }
  .chapter-eyebrow {
    font-family: var(--font-condensed);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--rci-red);
    margin-bottom: 8px;
  }
  .chapter-title {
    font-family: var(--font-display);
    font-size: clamp(34px, 4.5vw, 54px);
    line-height: 0.95;
    text-transform: uppercase;
    letter-spacing: -0.005em;
    margin: 0 0 14px;
    color: var(--fg, var(--rci-ink));
  }
  .chapter-intro {
    font-family: var(--font-serif);
    font-size: 17px;
    line-height: 1.5;
    color: var(--fg-soft, var(--rci-ink-soft, #4a4441));
    max-width: 75ch;
    margin: 0 0 14px;
  }
  .chapter-quote {
    margin: 0 0 18px;
    padding-left: 16px;
    border-left: 3px solid var(--rci-red);
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 15.5px;
    line-height: 1.45;
    color: var(--rci-ash);
    max-width: 70ch;
  }
  .chapter-quote cite {
    font-style: normal;
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 11.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .chapter-archive { margin: 2px 0 4px; }
  .chapter-no-match {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 15px;
    color: var(--rci-ash);
    margin: 20px 0 0;
  }
  @media (max-width: 720px) {
    .chapter-head { grid-template-columns: 1fr; gap: 14px; }
    .chapter-numeral { text-align: left; min-width: 0; }
  }

  /* Tier heads — descending visual weight */
  .chapter-tier { margin-top: 32px; }
  .tier-head {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .tier-head::after { content: ""; flex: 1 1 auto; }
  .tier-head--essential::after { border-top: 3px solid var(--rule); }
  .tier-head--deeper::after { border-top: 1.5px solid var(--rule); }
  .tier-head--further::after { border-top: 1px dashed var(--rule-soft); }
  .tier-head-label {
    font-family: var(--font-condensed);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .tier-head--essential .tier-head-label { color: var(--rci-red); }
  .tier-head--deeper .tier-head-label { color: var(--fg, var(--rci-ink)); }
  .tier-head--further .tier-head-label { color: var(--rci-ash); }

  /* Essential reading — large cards with typographic slab covers */
  .essential-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
    gap: 24px;
  }
  .essential-card {
    display: flex;
    border: 2px solid var(--rule);
    background: var(--paper);
    box-shadow: 4px 4px 0 var(--rule);
    text-decoration: none;
    color: inherit;
    min-height: 196px;
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms;
  }
  .essential-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--rule);
  }
  .essential-cover {
    flex: 0 0 130px;
    border-right: 2px solid var(--rule);
    position: relative;
  }
  .theory-slab {
    position: absolute;
    inset: 0;
    background: var(--rci-ink);
    color: var(--rci-offwhite);
    display: flex;
    flex-direction: column;
    padding: 12px;
    box-sizing: border-box;
    overflow: hidden;
  }
  body[data-mode="dark"] .theory-slab { background: #1e1915; }
  .theory-slab-texture {
    position: absolute;
    inset: 0;
    background-image: url("ds/textures/grunge-light-specks.jpg");
    background-size: cover;
    mix-blend-mode: screen;
    opacity: 0.1;
    pointer-events: none;
  }
  .theory-slab-author {
    font-family: var(--font-condensed);
    font-weight: 800;
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rci-red-hot);
    border-bottom: 1.5px solid var(--rci-red);
    padding-bottom: 4px;
    position: relative;
  }
  .theory-slab-title {
    font-family: var(--font-display);
    font-size: 13.5px;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: auto 0;
    position: relative;
    text-wrap: balance;
  }
  .theory-slab-foot {
    font-family: var(--font-condensed);
    font-size: 8.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--rci-fog, #9a918c);
    border-top: 1px solid rgba(246, 239, 239, 0.18);
    padding-top: 5px;
    position: relative;
  }
  .essential-body {
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1 1 auto;
  }
  .essential-author {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--rci-red);
  }
  .essential-title {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 18px;
    line-height: 1.12;
    text-transform: uppercase;
    margin: 0;
    color: var(--fg, var(--rci-ink));
  }
  .essential-desc {
    font-family: var(--font-serif);
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--fg-soft, var(--rci-ink-soft, #4a4441));
    margin: 0;
    flex: 1 1 auto;
  }
  .essential-go {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--fg, var(--rci-ink));
  }
  .essential-card:hover .essential-go { color: var(--rci-red); }

  /* Going deeper — medium text-first cards */
  .deeper-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
  }
  .deeper-card {
    border: 2px solid var(--rule);
    background: var(--paper);
    box-shadow: 3px 3px 0 var(--rule);
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms;
  }
  .deeper-card:hover {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--rule);
  }
  .deeper-author {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rci-red);
    margin-bottom: 5px;
  }
  .deeper-title {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 16px;
    line-height: 1.12;
    text-transform: uppercase;
    color: var(--fg, var(--rci-ink));
  }
  .deeper-note {
    font-family: var(--font-serif);
    font-size: 13px;
    line-height: 1.4;
    color: var(--fg-soft, var(--rci-ink-soft, #4a4441));
    margin: 6px 0 0;
  }

  /* Further study — compact ruled list */
  .further-list {
    border-top: 2px solid var(--rule);
    max-width: 860px;
  }
  .further-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 18px;
    padding: 9px 4px;
    border-bottom: 1px solid var(--rule-soft);
    text-decoration: none;
    color: inherit;
  }
  .further-title {
    font-family: var(--font-serif);
    font-size: 15px;
    color: var(--fg, var(--rci-ink));
  }
  .further-row:hover .further-title {
    color: var(--rci-red);
    text-decoration: underline;
  }
  .further-author {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rci-ash);
    white-space: nowrap;
  }

  /* Applied-topics compact grid */
  .theory-grid--compact {
    grid-template-columns: repeat(4, 1fr);
    gap: 24px 20px;
  }
  .theory-grid--compact .theory-card-body { padding: 14px; }
  .theory-grid--compact .theory-card-title { font-size: 17px; }
  .theory-grid--compact .theory-card-desc {
    font-size: 13px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  @media (max-width: 1100px) {
    .theory-grid--compact { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 860px) {
    .theory-grid--compact { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .theory-grid--compact { grid-template-columns: 1fr; }
  }
  .video-title--small {
    font-size: 17px;
    line-height: 1.15;
  }
  .video-desc {
    font-family: var(--font-serif);
    font-size: 15px;
    line-height: 1.45;
    color: var(--rci-ink-soft);
    margin: 0;
  }
  .video-desc--small {
    font-size: 13.5px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  body[data-mode="dark"] .video-desc { color: #d4cbc1; }

  /* ─── FOOTER ─────────────────────────────────────────────── */
  .site-foot {
    margin-top: 60px;
    padding: 36px 0 24px;
    border-top: 8px solid var(--rule);
    position: relative;
  }
  .foot-top {
    display: grid;
    grid-template-columns: 1.2fr 2fr;
    gap: 40px;
  }
  .foot-brand { display: flex; gap: 16px; align-items: flex-start; }
  .foot-brand img { width: 56px; height: 56px; }
  .foot-brand-wm {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 28px;
    color: var(--fg, var(--rci-ink));
    line-height: 1;
  }
  .foot-brand-tag {
    font-family: var(--font-article-title);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rci-ash);
    margin-top: 6px;
  }
  .foot-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .foot-col { display: flex; flex-direction: column; gap: 8px; }
  .foot-col-h {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--rci-red);
    margin-bottom: 4px;
    border-bottom: 2px solid var(--rci-ink);
    padding-bottom: 6px;
  }
  body[data-mode="dark"] .foot-col-h { border-bottom-color: var(--rci-offwhite); }
  .foot-col a {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--fg, var(--rci-ink));
    text-decoration: none;
  }
  body[data-mode="dark"] .foot-col a { color: #d4cbc1; }
  .foot-col a:hover { color: var(--rci-red); text-decoration: underline; }
  .foot-rule {
    height: 0;
    border-top: 1px solid var(--rule);
    margin: 32px 0 18px;
  }
  .foot-bot {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-condensed);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rci-ash);
  }

  /* ─── RESPONSIVE ──────────────────────────────────────────── */
  @media (max-width: 1100px) {
    .podcasts-grid { grid-template-columns: 1fr; }
    .episode-feed { border-left: 0; padding-left: 0; margin-top: 18px; border-top: 1px solid var(--rule-soft); padding-top: 24px; }
    .videos-grid { grid-template-columns: 1fr; }
    .video-list { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule-soft); padding-top: 24px; }
  }
  @media (max-width: 900px) {
    .foot-top { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .episode-row { grid-template-columns: 1fr 90px; }
    .episode-row-date { display: none; }
    .video-card-small { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .foot-cols { grid-template-columns: 1fr; }
  }

  /* Hamburger Menu Button */
  .mast-hamburger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: 2px solid var(--rule);
    background: var(--paper);
    color: var(--rci-ink);
    cursor: pointer;
    transition: background 90ms, color 90ms, transform 90ms cubic-bezier(0.2,0.7,0.1,1);
    padding: 0;
    flex-shrink: 0;
  }
  body[data-mode="dark"] .mast-hamburger { background: var(--paper); color: var(--rci-offwhite); }
  .mast-hamburger:hover {
    background: var(--rci-ink);
    color: var(--rci-offwhite);
  }
  body[data-mode="dark"] .mast-hamburger:hover {
    background: var(--rci-offwhite);
    color: var(--rci-ink);
  }
  .mast-hamburger:active {
    transform: translate(1px, 1px);
  }
  .mast-hamburger svg {
    width: 22px;
    height: 22px;
    display: block;
  }

  /* Drawer Overlay backdrop blur */
  .menu-drawer-overlay {
    position: fixed;
    inset: 0;
    background: transparent;
    z-index: 2000;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-y: auto;
    animation: fadeInDrawerOverlay 0.25s cubic-bezier(0.2, 0.7, 0.1, 1) forwards;
  }
  @keyframes fadeInDrawerOverlay {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Drawer Container */
  .menu-drawer {
    width: 100%;
    min-height: auto;
    background: var(--paper);
    border-bottom: 4px solid var(--rule);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    padding: 0;
    box-sizing: border-box;
    transform: translateY(-20px);
    opacity: 0;
    animation: slideDownDrawer 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    position: relative;
    z-index: 2001;
  }
  body[data-mode="dark"] .menu-drawer { background: var(--paper); }
  @keyframes slideDownDrawer {
    to { transform: translateY(0); opacity: 1; }
  }

  /* Inner Wrapper to Center Content */
  .menu-drawer-inner {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px 44px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    box-sizing: border-box;
  }

  /* Drawer Header */
  .menu-drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--rule);
    padding-bottom: 16px;
  }
  .menu-drawer-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .menu-drawer-brand img {
    width: 32px;
    height: 32px;
    display: block;
  }
  .menu-drawer-wm {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -0.01em;
    color: var(--rci-ink);
  }
  body[data-mode="dark"] .menu-drawer-wm { color: var(--rci-offwhite); }
  
  .menu-drawer-close {
    width: 36px;
    height: 36px;
    border: 2px solid var(--rule);
    background: transparent;
    color: var(--rci-ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 90ms, color 90ms, transform 90ms cubic-bezier(0.2,0.7,0.1,1);
    padding: 0;
  }
  body[data-mode="dark"] .menu-drawer-close { color: var(--rci-offwhite); }
  .menu-drawer-close:hover {
    background: var(--rci-ink);
    color: var(--rci-offwhite);
  }
  body[data-mode="dark"] .menu-drawer-close:hover {
    background: var(--rci-offwhite);
    color: var(--rci-ink);
  }
  .menu-drawer-close:active {
    transform: translate(1px, 1px);
  }
  .menu-drawer-close svg {
    width: 18px;
    height: 18px;
    display: block;
  }

  /* Drawer Layout (Sidebar + Categories) */
  .menu-drawer-layout {
    display: flex;
    gap: 48px;
    width: 100%;
  }
  .menu-drawer-sidebar {
    width: 300px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    border-right: 2px solid var(--rule-soft);
    padding-right: 32px;
  }
  .menu-drawer-categories {
    flex-grow: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px 40px;
  }

  /* Sidebar items (Economist left icons) */
  .drawer-sidebar-item {
    display: flex;
    gap: 16px;
    text-decoration: none;
    color: var(--rci-ink);
    padding: 12px 14px;
    border: 2px solid transparent;
    transition: all 120ms;
    align-items: flex-start;
  }
  body[data-mode="dark"] .drawer-sidebar-item { color: var(--rci-offwhite); }
  .drawer-sidebar-item:hover {
    background: var(--paper-soft);
    border-color: var(--rule-soft);
    transform: translate(2px, -2px);
    box-shadow: -3px 3px 0 var(--rci-ink);
  }
  body[data-mode="dark"] .drawer-sidebar-item:hover { box-shadow: -3px 3px 0 var(--rci-offwhite); }
  .drawer-sidebar-item svg {
    width: 28px;
    height: 28px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .drawer-sidebar-item-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .drawer-sidebar-item-title {
    font-family: var(--font-article-title);
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }
  .drawer-sidebar-item-desc {
    font-family: var(--font-serif);
    font-size: 12.5px;
    color: var(--rci-ash);
    line-height: 1.35;
  }

  /* Category Grid Links */
  .drawer-category {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .drawer-category-title {
    font-family: var(--font-condensed);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--rci-red);
    border-bottom: 1.5px solid var(--rci-red);
    padding-bottom: 4px;
    margin-bottom: 4px;
  }
  .drawer-category-links {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .drawer-category-link {
    font-family: var(--font-article-title);
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    color: var(--rci-ink);
    transition: color 90ms, padding-left 90ms;
    display: inline-flex;
    align-items: center;
  }
  body[data-mode="dark"] .drawer-category-link { color: var(--rci-offwhite); }
  .drawer-category-link:hover {
    color: var(--rci-red);
    padding-left: 6px;
  }
  .drawer-category-link::before {
    content: "·";
    margin-right: 6px;
    opacity: 0.5;
    font-weight: bold;
  }
  .drawer-category-link:hover::before {
    content: "→";
    color: var(--rci-red);
    opacity: 1;
  }

  /* Responsive Design */
  @media (max-width: 900px) {
    .menu-drawer-layout {
      flex-direction: column;
      gap: 24px;
    }
    .menu-drawer-sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 2px solid var(--rule-soft);
      padding-right: 0;
      padding-bottom: 16px;
    }
    .menu-drawer-categories {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  @media (max-width: 600px) {
    .menu-drawer-categories {
      grid-template-columns: 1fr;
    }
  }

  /* ─── NAV MENU/SEARCH TRIGGER + DRAWER SEARCH ─────────────── */
  .nav-menu-btn {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    flex: 0 0 auto;
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 9px 15px 8px;
    background: var(--rci-offwhite);
    color: var(--rci-ink);
    border: 2px solid var(--rci-ink);
    box-shadow: 3px 3px 0 var(--rci-ink);
    cursor: pointer;
    transition: transform 80ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 80ms, background 80ms, color 80ms;
  }
  .nav-menu-btn:hover { background: var(--rci-red); color: var(--rci-offwhite); border-color: var(--rci-red); box-shadow: 3px 3px 0 var(--rci-red); }
  .nav-menu-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--rci-ink); }
  .nav-menu-icon { width: 22px; height: 22px; display: block; }
  .nav-menu-label { line-height: 1; }
  body[data-mode="dark"] .nav-menu-btn { border-color: var(--rci-offwhite); color: var(--rci-offwhite); box-shadow: 3px 3px 0 var(--rci-offwhite); }
  @media (max-width: 540px) { .nav-menu-label { display: none; } .nav-menu-btn { padding: 9px 11px 8px; } }

  .menu-drawer-search {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 2px solid var(--rule);
    background: var(--paper-soft);
    padding: 14px 18px;
  }
  .menu-drawer-search svg { width: 22px; height: 22px; flex: 0 0 auto; color: var(--rci-ink); }
  body[data-mode="dark"] .menu-drawer-search svg { color: var(--rci-offwhite); }
  .menu-drawer-search-input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    background: transparent;
    outline: none;
    font-family: var(--font-body);
    font-size: 19px;
    letter-spacing: 0.01em;
    color: var(--rci-ink);
  }
  body[data-mode="dark"] .menu-drawer-search-input { color: var(--rci-offwhite); }
  .menu-drawer-search-input::placeholder { color: var(--rci-ink); opacity: 0.5; font-style: italic; }
  body[data-mode="dark"] .menu-drawer-search-input::placeholder { color: var(--rci-offwhite); }

</style>
