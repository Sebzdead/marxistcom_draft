<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Marxist.com — Home of the Revolutionary Communist International</title>

<link rel="stylesheet" href="ds/colors_and_type.css">
<link rel="stylesheet" href="ds/rci-web.css">

<style>
  /* ────────────────────────────────────────────────────────────
     Marxist.com homepage — print-materiality styling
     ──────────────────────────────────────────────────────────── */

  /* ── Design-system warm palette (overrides colors_and_type.css cool values) ── */
  :root {
    --rci-paper:      #fff1e5;
    --rci-paper-deep: #f4e4d3;
    --rci-paper-card: #fffaf3;
    --rci-ink:        #221c17;
    --rci-ink-soft:   #4a4039;
    --rci-ash:        #8a7d70;
    --rci-hairline:   #e4d0bb;
    --rci-hairline-2: #d3bca3;
    --rci-red:        #d4140f;
    --rci-red-hot:    #e6002b;
    --rci-red-dark:   #8a0608;
    --rci-blue:       #1d3a6b;
    --rci-ochre:      #bd7a17;
    --rci-green:      #2c5e3f;

    /* Bridge: legacy token names used by the inline CSS + components.jsx,
       remapped onto warm surfaces so nothing reads cool/grey. */
    --rci-offwhite:   #fffaf3;            /* was #f6efef — now warm paper-card */
    --rci-fog:        var(--rci-hairline-2);
    --page-bg:        var(--rci-paper);
    --page-bg-dark:   var(--rci-paper);   /* dark mode removed; keep var defined */
    --paper:          var(--rci-paper-card);
    --paper-soft:     var(--rci-paper-deep);
    --rule:           var(--rci-ink);
    --rule-soft:      var(--rci-hairline-2);
    --fg:             var(--rci-ink);
    --fg-soft:        var(--rci-ink-soft);

    /* Font direction (DS): reading = Cheltenham, headlines = Cormorant,
       Built Titling reserved for display, Trade Gothic Cond for chrome. */
    --font-body:          "Cheltenham BT", "Georgia", "Times New Roman", serif;
    --font-serif:         "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-serif-body:    "Cheltenham BT", "Georgia", "Times New Roman", serif;
    --font-article-title: "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-headline:      "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-display:       "Built Titling", "Trade Gothic Next LT Pro", "Arial Narrow", sans-serif;
    --font-condensed:     "Trade Gothic Next LT Pro Condensed", "Arial Narrow", sans-serif;
  }

  html, body { margin: 0; padding: 0; }
  html { background: var(--page-bg); }
  body {
    background: var(--page-bg);
    color: var(--rci-ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    position: relative;
  }

  /* Layer the actual content above the texture */
  #root { position: relative; z-index: 1; }

  .site {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 28px 64px;
  }

  /* Sticky masthead + nav — floats and travels on scroll.
     Full-bleed bar across the whole viewport; inner content stays centered. */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    background: var(--page-bg);
  }

  /* ─── MASTHEAD ────────────────────────────────────────────── */
  .masthead {
    border-bottom: 1px solid var(--rule-soft);
  }
  .mast-inner {
    max-width: 1320px;
    margin: 0 auto;
    padding: 10px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    box-sizing: border-box;
  }
  .mast-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; flex: 1 1 auto; min-width: 0; }
  .mast-logo { width: 38px; height: 38px; display: block; }
  .mast-brand-text { display: flex; flex-direction: column; justify-content: flex-end; }
  .mast-brand-pre {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13px;
    line-height: 1.1;
    color: var(--rci-ink-soft);
    text-transform: none;
    margin-bottom: 1px;
  }
  .mast-brand-name {
    font-family: var(--font-condensed);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    font-size: 22px;
    line-height: 0.95;
    white-space: nowrap;
    color: var(--rci-ink);
  }
  .mast-right { display: flex; align-items: center; gap: 18px; }
  .mast-lang {
    font-family: var(--font-condensed);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 12px;
    color: var(--rci-ink-soft);
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  .mast-lang:hover { color: var(--rci-red); }
  /* Drawer brand label: larger than the 17px masthead variant since it sits on one line */
  .menu-drawer-brand .mast-brand-name { font-size: 23px; letter-spacing: 0.02em; }
  .mast-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .mast-wordmark { display: flex; flex-direction: column; }
  .wm-title {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 42px;
    line-height: 0.95;
    letter-spacing: -0.01em;
    text-transform: none;
    color: var(--rci-ink);
  }
  .wm-dot { color: var(--rci-red); }
  .mast-slash {
    font-family: var(--font-display);
    font-size: 36px;
    color: var(--rci-red);
    font-weight: 400;
    line-height: 1;
    margin: 0 4px 4px;
  }
  .mast-tag {
    font-family: var(--font-article-title);
    text-transform: uppercase;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    line-height: 0.98;
    color: var(--rci-ink);
    padding-left: 0;
  }
  .mast-socials {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mast-social {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: 2px solid var(--rule);
    border-radius: 50%;
    background: var(--paper);
    color: var(--rci-ink);
    text-decoration: none;
    transition: background 90ms, color 90ms, transform 90ms cubic-bezier(0.2,0.7,0.1,1);
  }
  .mast-social svg { width: 18px; height: 18px; display: block; }
  .mast-social:hover {
    background: var(--rci-red);
    color: var(--rci-offwhite);
    border-color: var(--rci-red);
  }
  .mast-social:active { transform: translate(1px, 1px); }
  @media (max-width: 720px) {
    .mast-socials { display: none; }
  }

  .mast-search {
    display: flex; align-items: center;
    height: 44px;
    background: var(--paper);
    border: 2px solid var(--rule);
    transition: border-color 120ms, background 80ms;
    overflow: hidden;
  }
  .mast-search:focus-within { border-color: var(--rci-ink); }
  .mast-search-input {
    width: 0;
    padding: 0;
    border: 0;
    background: transparent;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.01em;
    color: var(--rci-ink);
    outline: none;
    transition: width 240ms cubic-bezier(0.2,0.7,0.1,1), padding 240ms;
  }
  .mast-search-input::placeholder { color: var(--rci-ink); opacity: 0.55; font-style: italic; }
  .mast-search[data-open="true"] .mast-search-input { width: 200px; padding: 0 4px 0 12px; }
  .mast-search-btn {
    width: 40px; height: 40px;
    flex: 0 0 40px;
    background: transparent;
    border: 0;
    padding: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--rci-ink);
    transition: background 80ms, color 80ms;
  }
  .mast-search-btn:hover { background: var(--rci-ink); color: var(--rci-offwhite); }
  .mast-search[data-open="true"] .mast-search-btn:hover { background: transparent; color: var(--rci-red); }
  .mast-search-btn svg { width: 18px; height: 18px; display: block; }
  .mast-search-btn:active { transform: translate(1px, 1px); }

  /* ─── NAV ─────────────────────────────────────────────────── */
  .primary-nav {
    border-bottom: 4px solid var(--rule);
  }
  .nav-inner {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 28px;
    box-sizing: border-box;
    display: flex;
    gap: 0;
    flex-wrap: wrap;
    align-items: stretch;
  }
  /* MENU + search trigger — flat, first item on the left */
  .nav-menu-btn {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    flex: 0 0 auto;
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 28px;
    background: none;
    color: var(--rci-ink);
    border: 0;
    border-right: 1px solid var(--rule-soft);
    cursor: pointer;
    transition: color 90ms;
  }
  .nav-menu-btn:first-child { padding-left: 0; }
  .nav-menu-btn:hover { color: var(--rci-red); }
  .nav-menu-icon { width: 24px; height: 24px; display: block; }
  .nav-menu-label { line-height: 1; }

  /* Flat editorial nav tabs with hairline dividers + active underline */
  .nav-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--rci-ink);
    text-decoration: none;
    padding: 10px 26px;
    border-right: 1px solid var(--rule-soft);
    transition: color 90ms;
  }
  .nav-link:hover { color: var(--rci-red); }
  .nav-link.is-active { color: var(--rci-ink); }
  .nav-link.is-active::after {
    content: "";
    position: absolute;
    left: 26px;
    right: 26px;
    bottom: 5px;
    height: 3px;
    background: var(--rci-red);
  }
  @media (max-width: 540px) {
    .nav-menu-label { display: none; }
    .nav-menu-btn { padding: 15px 18px; }
    .nav-link { padding: 15px 16px; font-size: 13px; }
    .nav-link.is-active::after { left: 16px; right: 16px; }
  }

  /* ─── HERO ────────────────────────────────────────────────── */
  .hero { padding: 28px 0 36px; }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.65fr 1fr;
    gap: 36px;
    align-items: start;
  }
  .hero-lead { display: flex; flex-direction: column; gap: 14px; text-decoration: none; color: inherit; }
  .hero-lead .rci-kicker { color: var(--rci-red); }
  .hero-h1--serif {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 52px;
    line-height: 1.0;
    letter-spacing: -0.01em;
    text-transform: none;
    margin: 0;
    color: var(--rci-ink);
    text-wrap: balance;
  }
  .hero-lead:hover .hero-h1--serif { color: var(--rci-red); }
  .hero-dek {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 20px;
    line-height: 1.4;
    color: var(--rci-ink-soft);
    margin: 0;
    max-width: 56ch;
  }
  .hero-byline {
    font-family: var(--font-condensed);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--rci-ash);
  }
  .hero-lead-img {
    width: 100%;
    aspect-ratio: 3 / 2;
    overflow: hidden;
    border: 2px solid var(--rule);
    box-shadow: 6px 6px 0 var(--rule);
    background: var(--rci-ink);
    margin-top: 4px;
  }
  .hero-lead-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .hero-secondary {
    display: flex;
    flex-direction: column;
    gap: 26px;
    border-left: 1px solid var(--rule-soft);
    padding-left: 28px;
  }
  .hero-sec-card { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; }
  .hero-sec-img {
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border: 2px solid var(--rule);
    box-shadow: 4px 4px 0 var(--rule);
    background: var(--rci-ink);
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms;
  }
  .hero-sec-card:hover .hero-sec-img { transform: translate(-1px,-1px); box-shadow: 6px 6px 0 var(--rule); }
  .hero-sec-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-sec-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 22px;
    line-height: 1.12;
    letter-spacing: -0.005em;
    margin: 2px 0 0;
    color: var(--rci-ink);
  }
  .hero-sec-card:hover .hero-sec-title { color: var(--rci-red); }
  .hero-sec-byline {
    font-family: var(--font-condensed);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rci-ash);
  }
  @media (max-width: 900px) {
    .hero-grid { grid-template-columns: 1fr; }
    .hero-secondary { border-left: 0; padding-left: 0; }
  }
  .hero-left {
    display: flex;
    flex-direction: column;
    gap: 28px;
    justify-content: space-between;
    border-left: 1px solid var(--rule-soft);
    padding-left: 22px;
  }
  .hero-side-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    flex: 1 1 0;
    min-height: 0;
  }
  .hero-side-img {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    min-height: 120px;
    overflow: hidden;
    border: 2px solid var(--rule);
    box-shadow: 4px 4px 0 var(--rule);
    background: var(--rci-ink);
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms;
  }
  .hero-side-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .hero-side-card:hover .hero-side-img {
    transform: translate(-1px, -1px);
    box-shadow: 6px 6px 0 var(--rule);
  }
  .hero-side-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 0 2px;
  }
  .hero-side-byline {
    font-family: var(--font-condensed);
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--rci-ink);
    font-weight: 700;
  }
  .hero-side-card:hover .hero-side-byline { color: var(--rci-red); }

  .hero-center { min-width: 0; display: flex; flex-direction: column; }
  .hero-feature { display: flex; flex-direction: column; gap: 18px; flex: 1; }
  .hero-feature-img {
    position: relative;
    width: 100%;
    flex: 0 0 auto;
    aspect-ratio: 3 / 2;
    overflow: hidden;
    border: 2px solid var(--rule);
    box-shadow: 6px 6px 0 var(--rule);
    background: var(--rci-ink);
  }
  .hero-feature-img-bg {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: center;
    filter: contrast(1.08) saturate(0.9);
  }
  .hero-feature-img-poster {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .hero-feature-img-grain { display: none; }
  .hero-feature-body { display: flex; flex-direction: column; gap: 10px; padding: 0 4px; }
  .hero-h1 {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 54px;
    line-height: 0.92;
    text-transform: uppercase;
    letter-spacing: -0.005em;
    margin: 4px 0 4px;
    color: var(--fg, var(--rci-ink));
    text-wrap: pretty;
  }
  .hero-h1--serif {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 52px;
    line-height: 1.0;
    text-transform: none;
    letter-spacing: -0.01em;
  }
  .hero-byline {
    font-family: var(--font-condensed);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--rci-ash);
  }
  .hero-dek {
    font-family: var(--font-serif);
    font-size: 18px;
    line-height: 1.45;
    color: var(--rci-ink-soft);
    margin: 4px 0 8px;
    max-width: 60ch;
  }
  .hero-dek b { color: var(--fg, var(--rci-ink)); font-weight: 700; }
  .hero-actions { display: flex; gap: 12px; margin-top: 4px; }

  /* LEFT column — "other featured" article cards (Atlantic-style) */
  .hero-featured {
    display: flex;
    flex-direction: column;
    gap: 24px;
    justify-content: space-between;
    border-right: 1px solid var(--rule-soft);
    padding-right: 22px;
  }

  /* LEFT column — "Most Read" numbered list (Guardian-style) */
  .most-read { display: flex; flex-direction: column; }
  .most-read-head {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 22px;
    line-height: 1.1;
    margin: 0;
    color: var(--fg, var(--rci-ink));
  }
  .most-read-sub {
    font-family: var(--font-condensed);
    font-size: 12.5px;
    letter-spacing: 0.04em;
    color: var(--rci-ash);
    margin: 4px 0 6px;
  }
  .most-read-item {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 13px 0;
    border-top: 1px solid var(--rule-soft);
    text-decoration: none;
    color: inherit;
  }
  .most-read-item:first-of-type { border-top: 1px solid var(--rule-soft); }
  .most-read-num {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 40px;
    line-height: 1;
    color: var(--rci-ash);
    flex: 0 0 auto;
    min-width: 38px;
  }
  .most-read-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 17px;
    line-height: 1.25;
    color: var(--fg, var(--rci-ink));
  }
  .most-read-item:hover .most-read-title { text-decoration: underline; }

  .hero-feat-card { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; }
  .hero-feat-img {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    overflow: hidden;
    border: 2px solid var(--rule);
    box-shadow: 4px 4px 0 var(--rule);
    background: var(--rci-ink);
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms;
  }
  .hero-feat-card:hover .hero-feat-img { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 var(--rule); }
  .hero-feat-img img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .hero-feat-meta { display: flex; flex-direction: column; gap: 4px; padding: 0 2px; }
  .hero-feat-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 24px;
    line-height: 1.12;
    text-transform: none;
    letter-spacing: -0.005em;
    color: var(--fg, var(--rci-ink));
    margin: 2px 0 0;
  }
  .hero-feat-card:hover .hero-feat-title { color: var(--rci-red); }
  .hero-feat-byline {
    font-family: var(--font-condensed);
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--rci-ash);
  }

  /* RIGHT column side cards now carry a headline line as well */
  .hero-side-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 20px;
    line-height: 1.14;
    text-transform: none;
    letter-spacing: -0.005em;
    color: var(--fg, var(--rci-ink));
    margin: 0;
  }
  .hero-side-card:hover .hero-side-title { color: var(--rci-red); }


  /* ─── CAMPAIGN ────────────────────────────────────────────── */
  .campaign { padding: 28px 0 36px; }
  .campaign-card {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    border: 2px solid var(--rci-ink);
    box-shadow: 6px 6px 0 var(--rci-ink);
    background: var(--paper);
    overflow: hidden;
  }
  .campaign-photo {
    position: relative;
    background: var(--rci-red);
    overflow: hidden;
    min-height: 460px;
  }
  .campaign-photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }
  .campaign-stamp {
    position: absolute;
    top: 22px;
    left: 22px;
    z-index: 2;
    padding: 10px 14px 8px;
    background: rgba(0,0,0,0.78);
    border: 2px solid var(--rci-offwhite);
    color: var(--rci-offwhite);
    font-family: var(--font-display);
    line-height: 0.92;
    transform: rotate(-3deg);
    box-shadow: 4px 4px 0 rgba(0,0,0,0.35);
  }
  .campaign-stamp-line {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-align: center;
  }
  .campaign-stamp-line--big {
    font-size: 26px;
    letter-spacing: 0.04em;
    color: var(--rci-red);
    margin-top: 2px;
  }
  .campaign-body {
    padding: 38px 42px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    justify-content: center;
  }
  .campaign-h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 44px;
    line-height: 0.94;
    text-transform: uppercase;
    margin: 0;

    grid-template-columns: 1.1fr 1fr;
    margin: 40px 0;
    border: 2px solid var(--rci-ink);
    box-shadow: 6px 6px 0 var(--rci-ink);
    overflow: hidden;
    min-height: 320px;
  }
  .manifesto-photo {
    position: relative;
    background: var(--rci-ink);
    background-image:
      linear-gradient(135deg, rgba(40,30,30,0.4), rgba(0,0,0,0.6)),
      url("ds/textures/grunge-light-specks.jpg");
    background-size: cover;
    background-blend-mode: multiply, normal;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    min-height: 320px;
  }
  .manifesto-photo-grain {
    position: absolute; inset: 0;
    background-image: url("ds/textures/film-grain.jpg");
    background-size: 500px;
    mix-blend-mode: multiply;
    opacity: 0.22;
    pointer-events: none;
  }
  .manifesto-flag {
    position: relative;
    width: 78%;
    max-width: 460px;
    height: auto;
    transform: rotate(-2deg);
    box-shadow: 8px 8px 0 rgba(0,0,0,0.4);
    border: 1px solid rgba(0,0,0,0.35);
    z-index: 1;
  }
  .manifesto-stamp {
    position: absolute;
    top: 20px;
    right: 22px;
    padding: 7px 12px 5px;
    border: 2px solid var(--rci-offwhite);
    color: var(--rci-offwhite);
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.22em;
    transform: rotate(4deg);
    background: rgba(0,0,0,0.4);
    z-index: 2;
  }
  .manifesto-panel {
    background: var(--rci-red);
    color: var(--rci-offwhite);
    padding: 42px 44px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    justify-content: center;
    position: relative;
  }
  .manifesto-panel::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url("ds/textures/red-paper-alt.jpg");
    background-size: cover;
    mix-blend-mode: multiply;
    opacity: 0.35;
    pointer-events: none;
  }
  .manifesto-h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 40px;
    line-height: 0.95;
    text-transform: uppercase;
    margin: 0;
    text-wrap: balance;
    position: relative;
  }
  .manifesto-body {
    font-family: var(--font-serif);
    font-size: 16px;
    line-height: 1.5;
    margin: 0;
    max-width: 48ch;
    position: relative;
  }
  .manifesto-actions { margin-top: 12px; position: relative; }

  /* ─── FOOTER ─────────────────────────────────────────────── */
  .site-foot {
    margin-top: 60px;
    padding: 40px 0 44px;
    border-top: 4px solid var(--rule);
    position: relative;
  }
  .foot-main {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 48px;
    align-items: center;
  }
  .foot-brand { display: flex; gap: 16px; align-items: center; }
  .foot-brand img { width: 58px; height: 58px; }
  .foot-brand-wm {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 28px;
    line-height: 1.04;
    color: var(--fg, var(--rci-ink));
    max-width: 14ch;
  }

  /* Manifesto card — centered in the middle column */
  .foot-manifesto-card {
    display: block;
    justify-self: center;
    width: 100%;
    max-width: 300px;
    text-decoration: none;
  }
  .foot-manifesto-img {
    width: 100%;
    aspect-ratio: 3 / 2;
    overflow: hidden;
    border: 2px solid var(--rule);
    box-shadow: 6px 6px 0 var(--rule);
    background: var(--rci-ink);
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms;
  }
  .foot-manifesto-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foot-manifesto-card:hover .foot-manifesto-img { transform: translate(-1px,-1px); box-shadow: 8px 8px 0 var(--rule); }

  /* Right column — stacked links */
  .foot-right {
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--rule-soft);
    padding-left: 44px;
  }
  .foot-link {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 25px;
    line-height: 1.15;
    letter-spacing: -0.005em;
    color: var(--fg, var(--rci-ink));
    text-decoration: none;
    padding: 18px 0;
    border-bottom: 1px dashed var(--rule-soft);
    transition: color 90ms, padding-left 90ms;
  }
  .foot-link:first-child { padding-top: 0; }
  .foot-link:last-child { border-bottom: 0; }
  .foot-link:hover { color: var(--rci-red); padding-left: 6px; }

  /* Hover behavior on hero feature image (subtle press feeling) */
  .hero-feature-img { transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms; }
  .hero-feature-img:hover { transform: translate(-1px, -1px); box-shadow: 8px 8px 0 var(--rule); }

  /* Responsive (down to ~900px) */
  @media (max-width: 1100px) {
    .hero-grid { grid-template-columns: 1.5fr 1fr; gap: 24px; }
    .four-up-grid { gap: 20px; }
    .latest-grid { gap: 24px 22px; }
    .hero-h1 { font-size: 44px; }
    .hero-h1--serif { font-size: 38px; }
  }
  @media (max-width: 900px) {
    .site { padding: 0 20px 48px; }
    .mast-inner, .nav-inner { padding-left: 20px; padding-right: 20px; }
    .hero-grid { grid-template-columns: 1fr; }
    .hero-featured { border-right: 0; padding-right: 0; }
    .hero-left { border-left: 0; padding-left: 0; }
    .four-up-grid { grid-template-columns: repeat(2, 1fr); }
    .latest-grid { grid-template-columns: repeat(2, 1fr); }
    .idom { grid-template-columns: 1fr; }
    .idom-cover { border-right: 0; border-bottom: 2px solid var(--rule); }
    .idom-articles { grid-template-columns: 1fr; }
    .idom-article { border-right: 0; border-bottom: 1px solid var(--rule-soft); padding: 16px 22px; }
    .idom-article:last-child { border-bottom: 0; }
    .join-banner, .manifesto { grid-template-columns: 1fr; }
    .topic-split { grid-template-columns: 1fr; gap: 16px; }
    .topic-col { border-right: 0; padding: 0; }
    .foot-top { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .four-up-grid { grid-template-columns: 1fr; }
    .latest-grid { grid-template-columns: 1fr; }
    .foot-cols { grid-template-columns: 1fr; }
    .mast-tag { display: none; }
    .wm-title { font-size: 32px; }
    .hero-h1 { font-size: 36px; }
  }

  /* Hamburger Menu Button */
  .mast-hamburger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: 2px solid var(--rule);
    background: var(--paper);
    color: var(--rci-ink);
    cursor: pointer;
    transition: background 90ms, color 90ms, transform 90ms cubic-bezier(0.2,0.7,0.1,1);
    padding: 0;
    flex-shrink: 0;
  }
  .mast-hamburger:hover {
    background: var(--rci-ink);
    color: var(--rci-offwhite);
  }
  .mast-hamburger:active {
    transform: translate(1px, 1px);
  }
  .mast-hamburger svg {
    width: 22px;
    height: 22px;
    display: block;
  }

  /* Drawer Overlay backdrop blur */
  .menu-drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(34, 28, 23, 0.12);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    z-index: 2000;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-y: auto;
  }

  /* Drawer Container */
  .menu-drawer {
    width: 100%;
    min-height: auto;
    background: var(--paper);
    border-bottom: 4px solid var(--rule);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    padding: 0;
    box-sizing: border-box;
    transform: translateY(-20px);
    opacity: 0;
    animation: slideDownDrawer 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    position: relative;
    z-index: 2001;
  }
  @keyframes slideDownDrawer {
    to { transform: translateY(0); opacity: 1; }
  }

  /* Inner Wrapper to Center Content */
  .menu-drawer-inner {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 22px 24px 30px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    box-sizing: border-box;
  }

  /* Drawer Header */
  .menu-drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--rule);
    padding-bottom: 12px;
  }
  .menu-drawer-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  /* Search field consolidated into the drawer */
  .menu-drawer-search {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 2px solid var(--rule);
    background: var(--paper-soft);
    padding: 14px 18px;
  }
  .menu-drawer-search svg { width: 24px; height: 24px; flex: 0 0 auto; color: var(--rci-ink); }
  .menu-drawer-search-input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    background: transparent;
    outline: none;
    font-family: var(--font-body);
    font-size: 21px;
    letter-spacing: 0.01em;
    color: var(--rci-ink);
  }
  .menu-drawer-search-input::placeholder { color: var(--rci-ink); opacity: 0.5; font-style: italic; }
  .menu-drawer-brand img {
    width: 32px;
    height: 32px;
    display: block;
  }
  .menu-drawer-wm {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -0.01em;
    color: var(--rci-ink);
  }
  
  .menu-drawer-close {
    width: 36px;
    height: 36px;
    border: 2px solid var(--rule);
    background: transparent;
    color: var(--rci-ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 90ms, color 90ms, transform 90ms cubic-bezier(0.2,0.7,0.1,1);
    padding: 0;
  }
  .menu-drawer-close:hover {
    background: var(--rci-ink);
    color: var(--rci-offwhite);
  }
  .menu-drawer-close:active {
    transform: translate(1px, 1px);
  }
  .menu-drawer-close svg {
    width: 18px;
    height: 18px;
    display: block;
  }

  /* Drawer Layout (Sidebar + Categories) */
  .menu-drawer-layout {
    display: flex;
    gap: 36px;
    width: 100%;
  }
  .menu-drawer-sidebar {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-right: 2px solid var(--rule-soft);
    padding-right: 28px;
  }
  .menu-drawer-categories {
    flex-grow: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px 36px;
  }

  /* Sidebar items (Economist left icons) */
  .drawer-sidebar-item {
    display: flex;
    gap: 13px;
    text-decoration: none;
    color: var(--rci-ink);
    padding: 9px 12px;
    border: 2px solid transparent;
    transition: all 120ms;
    align-items: center;
  }
  .drawer-sidebar-item:hover {
    background: var(--paper-soft);
    border-color: var(--rule-soft);
    transform: translate(2px, -2px);
    box-shadow: -3px 3px 0 var(--rci-ink);
  }
  .drawer-sidebar-item svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    flex-shrink: 0;
  }
  .drawer-sidebar-item-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .drawer-sidebar-item-title {
    font-family: var(--font-article-title);
    font-size: 19px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }

  /* Category Grid Links */
  .drawer-category {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .drawer-category-title {
    font-family: var(--font-condensed);
    font-weight: 800;
    font-size: 14.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--rci-red);
    border-bottom: 1.5px solid var(--rci-red);
    padding-bottom: 4px;
    margin-bottom: 2px;
  }
  .drawer-category-links {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .drawer-category-link {
    font-family: var(--font-article-title);
    font-size: 17.5px;
    font-weight: 700;
    text-decoration: none;
    color: var(--rci-ink);
    transition: color 90ms, padding-left 90ms;
    display: inline-flex;
    align-items: center;
  }
  .drawer-category-link:hover {
    color: var(--rci-red);
    padding-left: 6px;
  }
  .drawer-category-link::before {
    content: "·";
    margin-right: 6px;
    opacity: 0.5;
    font-weight: bold;
  }
  .drawer-category-link:hover::before {
    content: "→";
    color: var(--rci-red);
    opacity: 1;
  }

  /* Responsive Design */
  @media (max-width: 900px) {
    .menu-drawer-layout {
      flex-direction: column;
      gap: 24px;
    }
    .menu-drawer-sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 2px solid var(--rule-soft);
      padding-right: 0;
      padding-bottom: 16px;
    }
    .menu-drawer-categories {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  @media (max-width: 600px) {
    .menu-drawer-categories {
      grid-template-columns: 1fr;
    }
  }

  /* ── DS font-direction overrides: serif headlines are sentence case ── */
  .idom-title, .topic-title, .sections-title {
    font-family: var(--font-serif);
    font-weight: 700;
    text-transform: none;
    letter-spacing: -0.005em;
  }
  /* Serif card/headline titles are <h3>/<h4> elements; cancel the global
     element-level uppercase from colors_and_type.css so they read sentence case. */
  .hero-sec-title, .latest-scard-title, .trump2-link-title,
  .feat-title, .topic-glead-title, .muni-card-title {
    text-transform: none;
  }
  /* Built Titling stays caps ONLY on these display moments */
  .campaign-h2, .join-h2, .sections-h2, .manifesto-h2,
  .idom-toc-wordmark {
    font-family: var(--font-display);
    text-transform: uppercase;
  }
  .trump2 { padding: 14px 0 28px; }
  .trump2-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 36px; align-items: start; }
  .trump2-feature { display: block; text-decoration: none; color: inherit; position: relative; }
  .trump2-img {
    width: 100%; aspect-ratio: 16/10; overflow: hidden;
    border: 2px solid var(--rule); box-shadow: 6px 6px 0 var(--rule); background: var(--rci-ink);
  }
  .trump2-img img { width: 100%; height: 100%; object-fit: cover; object-position: center 25%; display: block; }
  .trump2-title {
    font-family: var(--font-serif);
    font-weight: 700;
    text-transform: none;
    font-size: 52px;
    line-height: 1.0;
    letter-spacing: -0.01em;
    margin: 16px 0 0;
    color: var(--rci-ink);
  }
  .trump2-feature:hover .trump2-title { color: var(--rci-red); }
  .trump2-links { display: flex; flex-direction: column; }
  .trump2-link {
    display: flex; flex-direction: column; gap: 5px;
    padding: 16px 0; border-top: 1px solid var(--rule-soft);
    text-decoration: none; color: inherit;
  }
  .trump2-link:first-child { border-top: 0; padding-top: 0; }
  .trump2-link-title {
    font-family: var(--font-serif); font-weight: 700; font-size: 21px;
    line-height: 1.15; letter-spacing: -0.005em; margin: 0; color: var(--rci-ink);
  }
  .trump2-link:hover .trump2-link-title { color: var(--rci-red); }
  .trump2-link-byline {
    font-family: var(--font-condensed); font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--rci-ash);
  }
  @media (max-width: 900px) { .trump2-grid { grid-template-columns: 1fr; } .trump2-title { font-size: 42px; } }
  .ats { margin: 36px 0; }
  .ats-inner {
    max-width: 1320px; margin: 0 auto; padding: 30px 28px;
    display: grid; grid-template-columns: 340px 1fr; gap: 32px; align-items: center;
  }
  .ats-logo { width: 200px; height: auto; display: block; margin-bottom: 16px; }
  .ats-eyebrow {
    font-family: var(--font-condensed); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.18em; font-size: 12px; color: var(--rci-red-hot);
  }
  .ats-title {
    font-family: var(--font-serif); font-weight: 700; font-size: 30px; line-height: 1.05;
    color: var(--rci-paper); margin: 8px 0 18px;
  }
  .ats-platforms { display: flex; gap: 10px; flex-wrap: wrap; }
  .ats-platform {
    font-family: var(--font-condensed); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.12em; font-size: 11px; padding: 8px 12px;
    border: 2px solid var(--rci-red); color: var(--rci-paper); text-decoration: none;
  }
  .ats-platform:hover { background: var(--rci-red); color: var(--rci-paper); }
  .ats-video {
    aspect-ratio: 16/9; border: 2px solid var(--rci-red); background: #16120f;
    display: grid; place-items: center; text-decoration: none;
  }
  .ats-play {
    width: 64px; height: 64px; background: rgba(212,20,15,.92);
    border: 2px solid var(--rci-paper); display: grid; place-items: center;
    color: #fff; font-size: 24px; line-height: 1;
  }
  @media (max-width: 900px) { .ats-inner { grid-template-columns: 1fr; } }
  .feat-pair-sec { padding: 8px 0 30px; }
  .feat-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .feat-card {
    position: relative; aspect-ratio: 5/4; overflow: hidden;
    border: 2px solid var(--rule); box-shadow: 4px 4px 0 var(--rule);
    display: flex; flex-direction: column; justify-content: flex-end;
    text-decoration: none;
  }
  .feat-bg {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    filter: contrast(1.05) saturate(0.95);
  }
  .feat-card::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(20,16,13,0.88));
  }
  .feat-body { position: relative; z-index: 2; padding: 26px; }
  .feat-title {
    font-family: var(--font-serif); font-weight: 700; font-size: 30px; line-height: 1.04;
    color: #fff; margin: 8px 0 0;
  }
  @media (max-width: 760px) { .feat-pair { grid-template-columns: 1fr; } }
  .topic-grid-sec { padding: 14px 0 30px; }
  .topic-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }
  .topic-gcol { display: flex; flex-direction: column; gap: 10px; }
  .topic-glead { display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; }
  .topic-gimg {
    position: relative; width: 100%; aspect-ratio: 4/3; overflow: hidden;
    border: 1.5px solid var(--rule); background: var(--rci-ink);
  }
  .topic-glead-title {
    font-family: var(--font-serif); font-weight: 700; font-size: 20px; line-height: 1.12;
    letter-spacing: -0.005em; margin: 0; color: var(--rci-ink);
  }
  .topic-glead:hover .topic-glead-title { color: var(--rci-red); }
  .topic-gmore { display: flex; flex-direction: column; }
  .topic-gmore-link {
    font-family: var(--font-serif); font-size: 15px; line-height: 1.25; color: var(--rci-ink-soft);
    padding: 9px 0; border-top: 1px dashed var(--rule-soft); text-decoration: none;
  }
  .topic-gmore-link:hover { color: var(--rci-red); }
  @media (max-width: 980px) { .topic-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .topic-grid { grid-template-columns: 1fr; } }
  .muni { padding: 16px 0 30px; }
  .muni-quote {
    display: block; text-align: center; text-decoration: none; color: inherit;
    max-width: 760px; margin: 8px auto 30px;
  }
  .muni-quote-text {
    font-family: var(--font-serif); font-style: italic; font-weight: 500;
    font-size: 30px; line-height: 1.25; color: var(--rci-ink); margin: 0;
  }
  .muni-quote:hover .muni-quote-text { color: var(--rci-red); }
  .muni-quote-cite {
    font-family: var(--font-condensed); text-transform: uppercase; letter-spacing: 0.12em;
    font-size: 12px; color: var(--rci-ash); margin: 12px 0 0;
  }
  .muni-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .muni-card {
    display: flex; flex-direction: column; gap: 8px; padding: 20px 18px;
    background: var(--rci-paper-card); border: 2px solid var(--rule); box-shadow: 4px 4px 0 var(--rule);
    text-decoration: none; color: inherit;
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms;
  }
  .muni-card:hover { transform: translate(-1px,-1px); box-shadow: 6px 6px 0 var(--rule); }
  .muni-card-title {
    font-family: var(--font-serif); font-weight: 700; font-size: 21px; line-height: 1.1;
    letter-spacing: -0.005em; margin: 0; color: var(--rci-ink);
  }
  .muni-card:hover .muni-card-title { color: var(--rci-red); }
