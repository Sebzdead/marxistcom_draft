<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Article — Marxist.com</title>

<link rel="stylesheet" href="ds/colors_and_type.css">
<link rel="stylesheet" href="ds/rci-web.css">

<style>
  /* ────────────────────────────────────────────────────────────
     Marxist.com article page — print-materiality styling
     ──────────────────────────────────────────────────────────── */

  /* ── Design-system warm palette (overrides colors_and_type.css cool values) ── */
  :root {

    /* Bridge: legacy token names used by the inline CSS + components.jsx,
       remapped onto warm surfaces so nothing reads cool/grey. */
    --rci-offwhite:   var(--rci-paper-card);            /* was #f6efef — now warm paper-card */
    --rci-fog:        var(--rci-hairline-2);
    --page-bg:        var(--rci-paper);
    --page-bg-dark:   var(--rci-paper);   /* dark mode removed; keep var defined */
    --paper:          var(--rci-paper-card);
    --paper-soft:     var(--rci-paper-deep);
    --rule:           var(--rci-ink);
    --rule-soft:      var(--rci-hairline-2);
    --fg:             var(--rci-ink);
    --fg-soft:        var(--rci-ink-soft);

    /* Font direction (DS): reading = Cheltenham, headlines = Cormorant,
       Built Titling reserved for display, Trade Gothic Cond for chrome. */
    --font-body:          "Cheltenham BT", "Georgia", "Times New Roman", serif;
    --font-serif:         "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-serif-body:    "Cheltenham BT", "Georgia", "Times New Roman", serif;
    --font-article-title: "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-headline:      "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-display:       "Built Titling", "Trade Gothic Next LT Pro", "Arial Narrow", sans-serif;
    --font-condensed:     "Trade Gothic Next LT Pro Condensed", "Arial Narrow", sans-serif;
  }

  html, body { margin: 0; padding: 0; }
  html { background: var(--page-bg); scroll-behavior: smooth; }
  body {
    background: var(--page-bg);
    color: var(--rci-ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    position: relative;
  }

  #root { position: relative; z-index: 1; }

  .site {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 28px 64px;
  }

  /* Sticky masthead + nav — floats and travels on scroll.
     Full-bleed bar across the whole viewport; inner content stays centered. */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    background: var(--page-bg);
  }

  /* ─── MASTHEAD ────────────────────────────────────────────── */
  .masthead {
    border-bottom: 1px solid var(--rule-soft);
  }
  .mast-inner {
    max-width: 1320px;
    margin: 0 auto;
    padding: 10px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    box-sizing: border-box;
  }
  .mast-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; flex: 1 1 auto; min-width: 0; }
  .mast-logo { width: 38px; height: 38px; display: block; }
  .mast-brand-text { display: flex; flex-direction: column; justify-content: flex-end; }
  .mast-brand-pre {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13px;
    line-height: 1.1;
    color: var(--rci-ink-soft);
    text-transform: none;
    margin-bottom: 1px;
  }
  .mast-brand-name {
    font-family: var(--font-condensed);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    font-size: 22px;
    line-height: 0.95;
    white-space: nowrap;
    color: var(--rci-ink);
  }
  .mast-right { display: flex; align-items: center; gap: 18px; }
  .mast-lang {
    font-family: var(--font-condensed);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 12px;
    color: var(--rci-ink-soft);
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  .mast-lang:hover { color: var(--rci-red); }
  /* Drawer brand label: larger than the 17px masthead variant since it sits on one line */
  .menu-drawer-brand .mast-brand-name { font-size: 23px; letter-spacing: 0.02em; }

  /* ─── NAV ─────────────────────────────────────────────────── */
  .primary-nav {
    border-bottom: 4px solid var(--rule);
  }
  .nav-inner {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 28px;
    box-sizing: border-box;
    display: flex;
    gap: 0;
    flex-wrap: wrap;
    align-items: stretch;
  }
  /* MENU + search trigger — flat, first item on the left */
  .nav-menu-btn {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    flex: 0 0 auto;
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 28px;
    background: none;
    color: var(--rci-ink);
    border: 0;
    border-right: 1px solid var(--rule-soft);
    cursor: pointer;
    transition: color 90ms;
  }
  .nav-menu-btn:first-child { padding-left: 0; }
  .nav-menu-btn:hover { color: var(--rci-red); }
  .nav-menu-icon { width: 24px; height: 24px; display: block; }
  .nav-menu-label { line-height: 1; }

  /* Flat editorial nav tabs with hairline dividers + active underline */
  .nav-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--rci-ink);
    text-decoration: none;
    padding: 10px 26px;
    border-right: 1px solid var(--rule-soft);
    transition: color 90ms;
  }
  .nav-link:hover { color: var(--rci-red); }
  .nav-link.is-active { color: var(--rci-ink); }
  .nav-link.is-active::after {
    content: "";
    position: absolute;
    left: 26px;
    right: 26px;
    bottom: 5px;
    height: 3px;
    background: var(--rci-red);
  }
  @media (max-width: 540px) {
    .nav-menu-label { display: none; }
    .nav-menu-btn { padding: 15px 18px; }
    .nav-link { padding: 15px 16px; font-size: 13px; }
    .nav-link.is-active::after { left: 16px; right: 16px; }
  }

  /* Drawer Overlay backdrop blur */
  .menu-drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(34, 28, 23, 0.12);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    z-index: 2000;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-y: auto;
  }

  /* Drawer Container */
  .menu-drawer {
    width: 100%;
    min-height: auto;
    background: var(--paper);
    border-bottom: 4px solid var(--rule);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    padding: 0;
    box-sizing: border-box;
    transform: translateY(-20px);
    opacity: 0;
    animation: slideDownDrawer 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    position: relative;
    z-index: 2001;
  }
  @keyframes slideDownDrawer {
    to { transform: translateY(0); opacity: 1; }
  }

  /* Inner Wrapper to Center Content */
  .menu-drawer-inner {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 22px 24px 30px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    box-sizing: border-box;
  }

  /* Drawer Header */
  .menu-drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--rule);
    padding-bottom: 12px;
  }
  .menu-drawer-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  /* Search field consolidated into the drawer */
  .menu-drawer-search {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 2px solid var(--rule);
    background: var(--paper-soft);
    padding: 14px 18px;
  }
  .menu-drawer-search svg { width: 24px; height: 24px; flex: 0 0 auto; color: var(--rci-ink); }
  .menu-drawer-search-input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    background: transparent;
    outline: none;
    font-family: var(--font-body);
    font-size: 21px;
    letter-spacing: 0.01em;
    color: var(--rci-ink);
  }
  .menu-drawer-search-input::placeholder { color: var(--rci-ink); opacity: 0.5; font-style: italic; }
  .menu-drawer-brand img {
    width: 32px;
    height: 32px;
    display: block;
  }
  .menu-drawer-wm {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -0.01em;
    color: var(--rci-ink);
  }
  
  .menu-drawer-close {
    width: 36px;
    height: 36px;
    border: 2px solid var(--rule);
    background: transparent;
    color: var(--rci-ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 90ms, color 90ms, transform 90ms cubic-bezier(0.2,0.7,0.1,1);
    padding: 0;
  }
  .menu-drawer-close:hover {
    background: var(--rci-ink);
    color: var(--rci-offwhite);
  }
  .menu-drawer-close svg {
    width: 18px;
    height: 18px;
    display: block;
  }

  /* Drawer Layout (Sidebar + Categories) */
  .menu-drawer-layout {
    display: flex;
    gap: 36px;
    width: 100%;
  }
  .menu-drawer-sidebar {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-right: 2px solid var(--rule-soft);
    padding-right: 28px;
  }
  .menu-drawer-categories {
    flex-grow: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px 36px;
  }

  /* Sidebar items (Economist left icons) */
  .drawer-sidebar-item {
    display: flex;
    gap: 13px;
    text-decoration: none;
    color: var(--rci-ink);
    padding: 9px 12px;
    border: 2px solid transparent;
    transition: all 120ms;
    align-items: center;
  }
  .drawer-sidebar-item:hover {
    background: var(--paper-soft);
    border-color: var(--rule-soft);
    transform: translate(2px, -2px);
  }
  .drawer-sidebar-item svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    flex-shrink: 0;
  }
  .drawer-sidebar-item-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .drawer-sidebar-item-title {
    font-family: var(--font-article-title);
    font-size: 19px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }

  /* Category Grid Links */
  .drawer-category {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .drawer-category-title {
    font-family: var(--font-condensed);
    font-weight: 800;
    font-size: 14.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--rci-red);
    border-bottom: 1.5px solid var(--rci-red);
    padding-bottom: 4px;
    margin-bottom: 2px;
  }
  .drawer-category-links {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .drawer-category-link {
    font-family: var(--font-article-title);
    font-size: 17.5px;
    font-weight: 700;
    text-decoration: none;
    color: var(--rci-ink);
    transition: color 90ms, padding-left 90ms;
    display: inline-flex;
    align-items: center;
  }
  .drawer-category-link:hover {
    color: var(--rci-red);
    padding-left: 6px;
  }
  .drawer-category-link::before {
    content: "·";
    margin-right: 6px;
    opacity: 0.5;
    font-weight: bold;
  }
  .drawer-category-link:hover::before {
    content: "→";
    color: var(--rci-red);
    opacity: 1;
  }

  /* Responsive Design */
  @media (max-width: 900px) {
    .menu-drawer-layout {
      flex-direction: column;
      gap: 24px;
    }
    .menu-drawer-sidebar {
      width: 100%;
      border-right: none;
      border-bottom: 2px solid var(--rule-soft);
      padding-right: 0;
      padding-bottom: 16px;
    }
    .menu-drawer-categories {
      grid-template-columns: repeat(2, 1fr);
    }
  }
  @media (max-width: 600px) {
    .menu-drawer-categories {
      grid-template-columns: 1fr;
    }
  }

  /* ─── ARTICLE GRID COLUMNS (under cover image) ────────────── */
  .article-grid-columns {
    display: grid;
    grid-template-columns: 1fr 640px 1fr;
    gap: 40px;
    align-items: start;
    width: 100%;
  }
  .article-content {
    grid-column: 2;
    max-width: 640px;
    width: 100%;
  }
  .article-sidebar {
    grid-column: 3;
    position: sticky;
    top: 120px;
  }

  /* ─── ARTICLE SIDEBAR / TRACKER ───────────────────────────── */
  .article-sidebar {
    position: sticky;
    top: 120px;
    height: fit-content;
    z-index: 10;
  }

  .timeline-bars-container {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 14px;
    width: 100%;
    user-select: none;
  }

  .timeline-bar-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    height: 12px;
    cursor: pointer;
    padding: 2px 0;
  }

  .timeline-bar-line {
    width: 20px;
    height: 2px;
    background: var(--rule-soft);
    transition: width 0.2s cubic-bezier(0.2, 0.7, 0.1, 1), 
                height 0.2s cubic-bezier(0.2, 0.7, 0.1, 1), 
                background-color 0.15s ease;
  }

  .timeline-bar-item:hover .timeline-bar-line {
    width: 32px;
    background: var(--rci-red);
  }

  .timeline-bar-item.active .timeline-bar-line {
    width: 32px;
    height: 4px;
    background: var(--rci-red);
  }

  /* Tooltip for minimalist bars */
  .timeline-bar-tooltip {
    position: absolute;
    right: 42px;
    left: auto;
    top: 50%;
    transform: translateY(-50%) translateX(-8px);
    background: var(--rci-ink);
    color: var(--rci-offwhite);
    padding: 6px 12px;
    border: 1px solid var(--rci-red);
    font-size: 11px;
    font-family: var(--font-condensed);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s cubic-bezier(0.2, 0.7, 0.1, 1), 
                transform 0.18s cubic-bezier(0.2, 0.7, 0.1, 1);
    z-index: 50;
  }

  .timeline-bar-item:hover .timeline-bar-tooltip {
    opacity: 1;
    transform: translateY(-50%) translateX(0);
  }

  /* Mobile Top Progress Bar */
  .mobile-top-progress {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 5px;
    background: rgba(0,0,0,0.06);
    z-index: 2000;
  }
  .mobile-top-progress-fill {
    height: 100%; width: 100%;
    background: var(--rci-red);
    transform-origin: top left;
    transform: scaleX(0);
    transition: transform 50ms linear;
  }

  /* ─── ARTICLE TEXT CONTAINER ──────────────────────────────── */
  .article-body-container {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    margin: 0 auto;
  }
  
  .article-header {
    border-bottom: none;
    padding-bottom: 0;
    margin-top: 64px; /* Space to the menu bar */
    margin-bottom: 12px; /* Flush with the cover image below it */
    text-align: center;
  }
  
  .article-title {
    font-family: var(--font-serif-display);
    font-weight: 700;
    font-size: clamp(38px, 5vw, 60px);
    line-height: 1.02;
    text-transform: none;
    letter-spacing: -0.015em;
    color: var(--rci-ink);
    margin: 0 auto;
    text-wrap: balance;
    max-width: 900px;
  }
  
  .article-meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 2px solid var(--rule);
    border-bottom: 2px solid var(--rule);
    padding: 14px 0;
    margin: 28px auto;
    font-family: var(--font-condensed);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    max-width: 640px;
    width: 100%;
    box-sizing: border-box;
  }
  .meta-left, .meta-right {
    display: flex;
    align-items: center;
  }
  .meta-category {
    font-weight: 700;
    color: var(--rci-ink);
  }
  .meta-author {
    color: var(--rci-ink);
  }
  .meta-date {
    color: var(--rci-ink);
    font-weight: 700;
  }
  .meta-divider {
    color: var(--rule-soft);
    margin: 0 10px;
  }
  .meta-read-time {
    color: var(--rci-ash);
  }
  
  .article-cover-wrap {
    margin: 12px auto 32px;
    background: transparent;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    border: none;
    max-width: 640px;
    width: 100%;
  }
  .article-cover-banner {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 2px solid var(--rule);
  }
  
  .article-cover-img {
    max-width: 100%;
    max-height: 480px;
    height: auto;
    object-fit: contain;
    display: block;
    border: none;
    box-shadow: none;
    filter: contrast(1.05) saturate(0.95);
  }

  /* AI TRANSCRIPTION PLAYER */
  .ai-player-container {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--paper);
    border: 2px solid var(--rule);
    padding: 16px 20px;
    margin-bottom: 32px;
    position: relative;
    width: 100%;
    box-sizing: border-box;
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms;
  }
  .ai-player-play-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--rci-red);
    color: var(--rci-offwhite);
    border: 2px solid var(--rule);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), background-color 90ms;
  }
  .ai-player-play-btn:hover {
    background: var(--rci-red-dark);
  }
  .ai-player-content {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ai-player-top-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .ai-player-label {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--rci-ink);
  }
  .ai-player-time {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--rci-ash);
  }
  .ai-player-slider-wrap {
    position: relative;
    height: 12px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .ai-player-slider-bg {
    position: absolute;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--rci-hairline-2);
  }
  .ai-player-slider-fill {
    position: absolute;
    left: 0;
    height: 4px;
    background: var(--rci-red);
    width: 0%;
  }
  .ai-player-slider-knob {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--rci-red);
    border: 1px solid var(--rule);
    transform: translateX(-50%);
    display: none;
  }
  .ai-player-slider-wrap:hover .ai-player-slider-knob {
    display: block;
  }
  
  /* Article content text formatting */
  .article-content {
    font-family: var(--font-serif);
    font-size: 19.5px;
    line-height: 1.6;
    color: var(--rci-ink);
  }
  
  .article-p {
    margin: 0 0 28px 0;
    max-width: none;
    text-align: left;
  }
  
  /* Dropcap style matching join.html */
  .article-p--lede::first-letter {
    font-family: var(--font-headline);
    font-weight: 700;
    font-size: 86px;
    line-height: 0.78;
    float: left;
    margin: 6px 14px 0 -2px;
    color: var(--rci-red);
    text-transform: uppercase;
  }
  
  .article-h2 {
    font-family: var(--font-serif-display);
    font-weight: 700;
    font-size: 32px;
    line-height: 1.1;
    text-transform: none;
    letter-spacing: -0.005em;
    color: var(--rci-ink);
    margin: 48px 0 22px 0;
    border-bottom: 2px solid var(--rule);
    padding-bottom: 8px;
    scroll-margin-top: 140px; /* Space for scrolling to heading */
    width: fit-content;
  }
  
  .article-figure {
    margin: 40px 0;
    border: 2px solid var(--rule);
    background: var(--paper-soft);
    padding: 0;
  }
  
  .article-img {
    width: 100%; display: block; height: auto;
    filter: contrast(1.05) saturate(0.95);
  }
  
  .article-figcaption {
    padding: 14px 20px;
    font-family: var(--font-condensed);
    font-size: 12.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--rci-ash);
    border-top: 2px solid var(--rule);
    background: var(--paper);
    line-height: 1.45;
  }
  
  .article-ul {
    margin: 0 0 28px 0;
    padding-left: 28px;
    max-width: none;
  }
  .article-ul li {
    margin-bottom: 10px;
  }
  
  .article-video-wrap {
    position: relative;
    padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
    height: 0; overflow: hidden;
    margin: 40px 0;
    border: 2px solid var(--rule);
  }
  
  .article-video {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* Native CSS Animation Progress Timeline */
  @media (prefers-reduced-motion: no-preference) {
    @supports ((animation-timeline: scroll())) {
      @keyframes grow-vertical-progress {
        from { transform: scaleY(0); }
        to { transform: scaleY(1); }
      }
      @keyframes grow-horizontal-progress {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      .timeline-progress-fill {
        animation: grow-vertical-progress auto linear;
        animation-timeline: scroll();
      }
      .mobile-top-progress-fill {
        animation: grow-horizontal-progress auto linear;
        animation-timeline: scroll();
      }
    }
  }

  /* ─── RELATED ARTICLES ───────────────────────────────────── */
  .related-articles-section {
    margin: 32px auto 24px;
    border-bottom: 2px solid var(--rule);
    padding-bottom: 24px;
    width: 100%;
  }
  .related-articles-section h2 {
    font-family: var(--font-display);
    font-size: 24px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--rci-ink);
    margin: 0 0 20px 0;
    border-bottom: 2px solid var(--rule);
    padding-bottom: 8px;
    width: fit-content;
  }
  .related-cards {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 280px;
    gap: 20px;
    overflow-x: auto;
    padding-bottom: 14px;
    scroll-snap-type: x mandatory;
  }
  .related-cards::-webkit-scrollbar {
    height: 8px;
  }
  .related-cards::-webkit-scrollbar-thumb {
    background: var(--rci-hairline-2);
  }
  .related-cards > * {
    scroll-snap-align: start;
  }
  .related-card {
    display: flex;
    flex-direction: row;
    gap: 16px;
    text-decoration: none;
    color: inherit;
    padding-right: 20px;
    border-right: 1px solid var(--rule-soft);
  }
  .related-card:last-child {
    border-right: none;
    padding-right: 0;
  }
  .related-card-img {
    width: 80px;
    height: 80px;
    flex-shrink: 0;
    border: 1.5px solid var(--rule);
    overflow: hidden;
    position: relative;
  }
  .related-card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .related-card-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .related-card-category {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--rci-red);
  }
  .related-card-title {
    font-family: var(--font-serif);
    font-size: 14.5px;
    line-height: 1.25;
    color: var(--rci-ink);
    font-weight: 700;
    margin: 0;
    text-decoration: underline;
    text-decoration-color: var(--rci-hairline-2);
    text-underline-offset: 3px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .related-card:hover .related-card-title {
    color: var(--rci-red);
    text-decoration-color: var(--rci-red);
  }

  /* ─── CATEGORIES AND TAGS ────────────────────────────────── */
  .article-categories {
    border-top: 1px dashed var(--rule-soft);
    margin-top: 32px;
    padding-top: 16px;
    margin-bottom: 24px;
  }
  .article-tags {
    margin-top: 24px;
    padding-top: 0;
  }
  .taxonomy-row {
    display: flex;
    font-size: 14px;
    line-height: 1.4;
  }
  .taxonomy-label {
    font-family: var(--font-condensed);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--rci-ash);
    width: 110px;
    flex-shrink: 0;
  }
  .taxonomy-value {
    font-family: var(--font-body);
    color: var(--rci-ink);
    font-weight: 700;
  }
  .taxonomy-value a {
    color: var(--rci-ink);
    text-decoration: underline;
  }
  .taxonomy-value a:hover {
    color: var(--rci-red);
  }

  /* ─── FOOTER ─────────────────────────────────────────────── */
  .site-foot {
    margin-top: 80px;
    padding: 48px 0 64px;
    border-top: 8px solid var(--rule);
    background: var(--rci-paper-deep);
  }
  .foot-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
    width: 100%;
    box-sizing: border-box;
  }
  .foot-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    background: var(--paper);
    border: 2px solid var(--rule);
    padding: 16px;
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms;
  }
  .foot-card:hover {
    transform: translate(-2px, -2px);
  }
  .foot-card-img {
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border: 2px solid var(--rule);
    position: relative;
  }
  .foot-card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .foot-card-kicker {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--rci-red);
    margin-top: 4px;
  }
  .foot-card-title {
    font-family: var(--font-serif);
    font-size: 19px;
    line-height: 1.2;
    color: var(--rci-ink);
    font-weight: 700;
    margin: 2px 0;
  }
  .foot-card-byline {
    font-family: var(--font-condensed);
    font-size: 11.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--rci-ash);
  }

  /* ─── RESPONSIVE BREAKPOINTS ──────────────────────────────── */
  @media (max-width: 1100px) {
    .article-grid-columns {
      grid-template-columns: 1fr 640px 60px;
      gap: 20px;
    }
  }

  @media (max-width: 950px) {
    .site { padding: 0 20px 48px; }
    
    .mobile-top-progress {
      display: block;
    }
    
    .article-hero-section {
      grid-template-columns: 1fr;
      gap: 24px;
      margin: 32px auto;
    }
    .article-hero-right {
      order: -1;
    }
    .article-header {
      text-align: center;
    }
    .article-meta-row {
      margin: 20px auto;
      max-width: 640px;
    }
    
    .article-grid-columns {
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .article-content {
      grid-column: 1;
      max-width: 100%;
      padding: 0;
    }
    
    .article-sidebar {
      position: fixed;
      right: 16px;
      left: auto;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1000;
      grid-column: auto;
    }
    
    .timeline-bars-container {
      gap: 10px;
    }
    
    .timeline-bar-line {
      width: 16px;
      height: 2px;
    }
    
    .timeline-bar-item:hover .timeline-bar-line {
      width: 24px;
    }
    
    .timeline-bar-item.active .timeline-bar-line {
      width: 24px;
      height: 3px;
    }

    .timeline-bar-tooltip {
      right: 32px;
    }
    
    .article-body-container {
      padding: 0;
    }
  }

  @media (max-width: 760px) {
    .foot-cards {
      grid-template-columns: 1fr;
    }
    .related-cards {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 560px) {
    .wm-title { font-size: 32px; }
  }
</style>
</head>
