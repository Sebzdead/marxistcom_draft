<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Podcasts & Media — Marxist.com</title>

<link rel="stylesheet" href="ds/colors_and_type.css">
<link rel="stylesheet" href="ds/rci-web.css">

<style>
  /* ────────────────────────────────────────────────────────────
     Marxist.com — Podcasts & Media page styling
     Print-materiality visual language:
       • paper substrate + film grain
       • ink rules, hard 2.5D offset shadows, zero-radius corners
       • Built Titling display, Cheltenham serif body, Trade Gothic eyebrows
     ──────────────────────────────────────────────────────────── */

  /* ── Design-system warm palette (overrides colors_and_type.css cool values) ── */
  :root {

    /* Bridge: legacy token names used by the inline CSS + components.jsx,
       remapped onto warm surfaces so nothing reads cool/grey. */
    --rci-offwhite:   var(--rci-paper-card);            /* was #f6efef — now warm paper-card */
    --rci-fog:        var(--rci-hairline-2);
    --page-bg:        var(--rci-paper);
    --page-bg-dark:   var(--rci-paper);   /* dark mode removed; keep var defined */
    --paper:          var(--rci-paper-card);
    --paper-soft:     var(--rci-paper-deep);
    --rule:           var(--rci-ink);
    --rule-soft:      var(--rci-hairline-2);
    --fg:             var(--rci-ink);
    --fg-soft:        var(--rci-ink-soft);

    /* Font direction (DS): reading = Cheltenham, headlines = Cormorant,
       Built Titling reserved for display, Trade Gothic Cond for chrome. */
    --font-body:          "Cheltenham BT", "Georgia", "Times New Roman", serif;
    --font-serif:         "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-serif-body:    "Cheltenham BT", "Georgia", "Times New Roman", serif;
    --font-article-title: "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-headline:      "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-display:       "Built Titling", "Trade Gothic Next LT Pro", "Arial Narrow", sans-serif;
    --font-condensed:     "Trade Gothic Next LT Pro Condensed", "Arial Narrow", sans-serif;
  }

  html, body { margin: 0; padding: 0; }
  html { background: var(--page-bg); }
  body {
    background: var(--page-bg);
    color: var(--rci-ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    position: relative;
  }

  #root { position: relative; z-index: 1; }

  .site {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 28px 64px;
  }

  /* Sticky masthead + nav — floats and travels on scroll.
     Full-bleed bar across the whole viewport; inner content stays centered. */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    background: var(--page-bg);
  }

  /* ─── MASTHEAD ────────────────────────────────────────────── */
  .masthead {
    border-bottom: 1px solid var(--rule-soft);
  }
  .mast-inner {
    max-width: 1320px;
    margin: 0 auto;
    padding: 10px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    box-sizing: border-box;
  }
  .mast-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; flex: 1 1 auto; min-width: 0; }
  .mast-logo { width: 38px; height: 38px; display: block; }
  .mast-brand-text { display: flex; flex-direction: column; justify-content: flex-end; }
  .mast-brand-pre {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13px;
    line-height: 1.1;
    color: var(--rci-ink-soft);
    text-transform: none;
    margin-bottom: 1px;
  }
  .mast-brand-name {
    font-family: var(--font-condensed);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    font-size: 22px;
    line-height: 0.95;
    white-space: nowrap;
    color: var(--rci-ink);
  }
  .mast-right { display: flex; align-items: center; gap: 18px; }
  .mast-lang {
    font-family: var(--font-condensed);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-size: 12px;
    color: var(--rci-ink-soft);
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  .mast-lang:hover { color: var(--rci-red); }
  /* Drawer brand label: larger than the 17px masthead variant since it sits on one line */
  .menu-drawer-brand .mast-brand-name { font-size: 23px; letter-spacing: 0.02em; }

  /* ─── NAV ─────────────────────────────────────────────────── */
  .primary-nav {
    border-bottom: 4px solid var(--rule);
  }
  .nav-inner {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 28px;
    box-sizing: border-box;
    display: flex;
    gap: 0;
    flex-wrap: wrap;
    align-items: stretch;
  }
  /* MENU + search trigger — flat, first item on the left */
  .nav-menu-btn {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    flex: 0 0 auto;
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 28px;
    background: none;
    color: var(--rci-ink);
    border: 0;
    border-right: 1px solid var(--rule-soft);
    cursor: pointer;
    transition: color 90ms;
  }
  .nav-menu-btn:first-child { padding-left: 0; }
  .nav-menu-btn:hover { color: var(--rci-red); }
  .nav-menu-icon { width: 24px; height: 24px; display: block; }
  .nav-menu-label { line-height: 1; }

  /* Flat editorial nav tabs with hairline dividers + active underline */
  .nav-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--rci-ink);
    text-decoration: none;
    padding: 10px 26px;
    border-right: 1px solid var(--rule-soft);
    transition: color 90ms;
  }
  .nav-link:hover { color: var(--rci-red); }
  .nav-link.is-active { color: var(--rci-ink); }
  .nav-link.is-active::after {
    content: "";
    position: absolute;
    left: 26px;
    right: 26px;
    bottom: 5px;
    height: 3px;
    background: var(--rci-red);
  }
  @media (max-width: 540px) {
    .nav-menu-label { display: none; }
    .nav-menu-btn { padding: 15px 18px; }
    .nav-link { padding: 15px 16px; font-size: 13px; }
    .nav-link.is-active::after { left: 16px; right: 16px; }
  }

  /* Drawer Overlay backdrop blur */
  .menu-drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(34, 28, 23, 0.12);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    z-index: 2000;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-y: auto;
  }

  /* Drawer Container */
  .menu-drawer {
    width: 100%;
    min-height: auto;
    background: var(--paper);
    border-bottom: 4px solid var(--rule);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    padding: 0;
    box-sizing: border-box;
    transform: translateY(-20px);
    opacity: 0;
    animation: slideDownDrawer 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    position: relative;
    z-index: 2001;
  }
  @keyframes slideDownDrawer {
    to { transform: translateY(0); opacity: 1; }
  }

  /* Inner Wrapper to Center Content */
  .menu-drawer-inner {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 22px 24px 30px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    box-sizing: border-box;
  }

  /* Drawer Header */
  .menu-drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--rule);
    padding-bottom: 12px;
  }
  .menu-drawer-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  /* Search field consolidated into the drawer */
  .menu-drawer-search {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 2px solid var(--rule);
    background: var(--paper-soft);
    padding: 14px 18px;
  }
  .menu-drawer-search svg { width: 24px; height: 24px; flex: 0 0 auto; color: var(--rci-ink); }
  .menu-drawer-search-input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    background: transparent;
    outline: none;
    font-family: var(--font-body);
    font-size: 21px;
    letter-spacing: 0.01em;
    color: var(--rci-ink);
  }
  .menu-drawer-search-input::placeholder { color: var(--rci-ink); opacity: 0.5; font-style: italic; }
  .menu-drawer-brand img {
    width: 32px;
    height: 32px;
    display: block;
  }
  .menu-drawer-wm {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -0.01em;
    color: var(--rci-ink);
  }
  
  .menu-drawer-close {
    width: 36px;
    height: 36px;
    border: 2px solid var(--rule);
    background: transparent;
    color: var(--rci-ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 90ms, color 90ms, transform 90ms cubic-bezier(0.2,0.7,0.1,1);
    padding: 0;
  }
  .menu-drawer-close:hover {
    background: var(--rci-ink);
    color: var(--rci-offwhite);
  }
  .menu-drawer-close svg {
    width: 18px;
    height: 18px;
    display: block;
  }

  /* Drawer Layout (Sidebar + Categories) */
  .menu-drawer-layout {
    display: flex;
    gap: 36px;
    width: 100%;
  }
  .menu-drawer-sidebar {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-right: 2px solid var(--rule-soft);
    padding-right: 28px;
  }
  .menu-drawer-categories {
    flex-grow: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px 36px;
  }

  /* Sidebar items (Economist left icons) */
  .drawer-sidebar-item {
    display: flex;
    gap: 13px;
    text-decoration: none;
    color: var(--rci-ink);
    padding: 9px 12px;
    border: 2px solid transparent;
    transition: all 120ms;
    align-items: center;
  }
  .drawer-sidebar-item:hover {
    background: var(--paper-soft);
    border-color: var(--rule-soft);
    transform: translate(2px, -2px);
  }
  .drawer-sidebar-item svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    flex-shrink: 0;
  }
  .drawer-sidebar-item-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .drawer-sidebar-item-title {
    font-family: var(--font-article-title);
    font-size: 19px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }

  /* Category Grid Links */
  .drawer-category {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .drawer-category-title {
    font-family: var(--font-condensed);
    font-weight: 800;
    font-size: 14.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--rci-red);
    border-bottom: 1.5px solid var(--rci-red);
    padding-bottom: 4px;
    margin-bottom: 2px;
  }
  .drawer-category-links {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .drawer-category-link {
    font-family: var(--font-article-title);
    font-size: 17.5px;
    font-weight: 700;
    text-decoration: none;
    color: var(--rci-ink);
    transition: color 90ms, padding-left 90ms;
    display: inline-flex;
    align-items: center;
  }
  .drawer-category-link:hover {
    color: var(--rci-red);
    padding-left: 6px;
  }
  .drawer-category-link::before {
    content: "·";
    margin-right: 6px;
    opacity: 0.5;
    font-weight: bold;
  }
  .drawer-category-link:hover::before {
    content: "→";
    color: var(--rci-red);
    opacity: 1;
  }

  /* ─── PODCASTS SECTION ────────────────────────────────────── */
  .podcasts-section {
    padding: 28px 0 36px;
  }
  .podcasts-grid {
    display: grid;
    grid-template-columns: 460px 1fr;
    gap: 32px;
    align-items: start;
    margin-top: 18px;
  }
  .podcasts-left {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  
  /* Podcast card (2.5D hard offset) */
  .podcast-card {
    border: 2px solid var(--rule);
    background: var(--paper);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 24px;
    gap: 18px;
  }
  .podcast-card-header {
    display: flex;
    gap: 16px;
  }
  .podcast-cover-wrap {
    width: 110px;
    height: 110px;
    flex-shrink: 0;
    border: 2px solid var(--rule);
    position: relative;
    background: var(--rci-ink);
  }
  .podcast-cover {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .podcast-info {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
  }
  .podcast-title {
    font-family: var(--font-article-title);
    font-weight: 800;
    font-size: 22px;
    line-height: 1.1;
    margin: 0 0 4px;
    text-transform: uppercase;
  }
  .podcast-desc {
    font-family: var(--font-serif);
    font-size: 14px;
    line-height: 1.4;
    color: var(--rci-ink-soft);
    margin: 0;
  }
  
  /* Listen links & badges */
  .podcast-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .listen-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1.5px solid var(--rule);
    padding: 5px 10px;
    background: var(--paper);
    color: var(--rci-ink);
    transition: background 80ms, color 80ms, transform 80ms;
  }
  .listen-badge:hover {
    background: var(--rci-ink);
    color: var(--rci-offwhite);
  }
  .listen-badge svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  /* Embedded Player */
  .embed-container {
    width: 100%;
    height: 152px;
    border: 2px solid var(--rule);
    background: var(--rci-ink);
    position: relative;
    overflow: hidden;
  }
  .embed-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  /* Episode list column */
  .episode-feed {
    border-left: 1px solid var(--rule-soft);
    padding-left: 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .feed-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--rule);
    padding-bottom: 12px;
  }
  .feed-filter-btn {
    display: flex;
    gap: 8px;
  }
  .episode-list {
    display: flex;
    flex-direction: column;
  }
  .episode-row {
    display: grid;
    grid-template-columns: 100px 1fr 90px;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px dashed var(--rule-soft);
    text-decoration: none;
    color: inherit;
    align-items: start;
    transition: background 90ms;
  }
  .episode-row:hover {
    background: rgba(218, 13, 16, 0.03);
  }
  .episode-row:last-child {
    border-bottom: 0;
  }
  .episode-row-date {
    font-family: var(--font-condensed);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--rci-ash);
    padding-top: 4px;
  }
  .episode-row-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .episode-row-kicker {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--rci-red);
  }
  .episode-row-title {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 18px;
    line-height: 1.15;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.005em;
  }
  .episode-row-title--serif {
    font-family: var(--font-article-title);
    text-transform: none;
    font-size: 19px;
    letter-spacing: -0.005em;
  }
  .episode-row:hover .episode-row-title {
    color: var(--rci-red);
    text-decoration: underline;
    text-decoration-thickness: 2px;
  }
  .episode-row-desc {
    font-family: var(--font-serif);
    font-size: 14px;
    line-height: 1.4;
    color: var(--rci-ink-soft);
    margin: 4px 0 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .episode-row-duration {
    font-family: var(--font-condensed);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--rci-ash);
    text-align: right;
    padding-top: 4px;
  }

  /* ─── YOUTUBE VIDEOS SECTION ──────────────────────────────── */
  .videos-section {
    padding: 36px 0 28px;
  }
  .videos-grid {
    display: grid;
    grid-template-columns: 1.25fr 1fr;
    gap: 32px;
    margin-top: 18px;
  }
  
  .video-featured {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .video-list {
    display: flex;
    flex-direction: column;
    gap: 24px;
    border-left: 1px solid var(--rule-soft);
    padding-left: 32px;
  }
  
  .video-player-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 2px solid var(--rule);
    background: var(--rci-ink);
    position: relative;
    overflow: hidden;
    transition: transform 90ms, box-shadow 90ms;
  }
  .video-player-wrap iframe {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border: 0;
  }
  
  .video-card-small {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 16px;
    align-items: start;
  }
  .video-card-small .video-player-wrap {
    box-shadow: none;
  }

  .video-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .video-title {
    font-family: var(--font-article-title);
    font-weight: 800;
    font-size: 26px;
    line-height: 1.05;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.005em;
  }
  .video-title--small {
    font-size: 17px;
    line-height: 1.15;
  }
  .video-desc {
    font-family: var(--font-serif);
    font-size: 15px;
    line-height: 1.45;
    color: var(--rci-ink-soft);
    margin: 0;
  }
  .video-desc--small {
    font-size: 13.5px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ─── FOOTER ─────────────────────────────────────────────── */
  .site-foot {
    margin-top: 80px;
    padding: 48px 0 64px;
    border-top: none;
    background: var(--rci-paper-deep);
  }
  .foot-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
    width: 100%;
    box-sizing: border-box;
  }
  .foot-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    background: var(--paper);
    border: 2px solid var(--rule);
    padding: 16px;
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms;
  }
  .foot-card:hover {
    transform: translate(-2px, -2px);
  }
  .foot-card-img {
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    border: 2px solid var(--rule);
    position: relative;
  }
  .foot-card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .foot-card-kicker {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--rci-red);
    margin-top: 4px;
  }
  .foot-card-title {
    font-family: var(--font-serif);
    font-size: 19px;
    line-height: 1.2;
    color: var(--rci-ink);
    font-weight: 700;
    margin: 2px 0;
  }
  .foot-card-byline {
    font-family: var(--font-condensed);
    font-size: 11.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--rci-ash);
  }

  /* ─── RESPONSIVE BREAKPOINTS ──────────────────────────────── */
  @media (max-width: 1100px) {
    .podcasts-grid { grid-template-columns: 1fr; }
    .episode-feed { border-left: 0; padding-left: 0; margin-top: 18px; border-top: 1px solid var(--rule-soft); padding-top: 24px; }
    .videos-grid { grid-template-columns: 1fr; }
    .video-list { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule-soft); padding-top: 24px; }
  }
  
  @media (max-width: 900px) {
