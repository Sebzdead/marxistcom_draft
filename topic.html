<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Marxist Economics — Marxist.com</title>

<link rel="stylesheet" href="ds/colors_and_type.css">
<link rel="stylesheet" href="ds/rci-web.css">

<style>
  :root {

    /* Bridge: legacy token names used by the inline CSS + components.jsx,
       remapped onto warm surfaces so nothing reads cool/grey. */
    --rci-offwhite:   var(--rci-paper-card);
    --rci-fog:        var(--rci-hairline-2);
    --page-bg:        var(--rci-paper);
    --page-bg-dark:   var(--rci-paper);
    --paper:          var(--rci-paper-card);
    --paper-soft:     var(--rci-paper-deep);
    --rule:           var(--rci-ink);
    --rule-soft:      var(--rci-hairline-2);
    --fg:             var(--rci-ink);
    --fg-soft:        var(--rci-ink-soft);

    --font-body:          "Cheltenham BT", "Georgia", "Times New Roman", serif;
    --font-serif:         "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-serif-body:    "Cheltenham BT", "Georgia", "Times New Roman", serif;
    --font-article-title: "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-headline:      "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-display:       "Built Titling", "Trade Gothic Next LT Pro", "Arial Narrow", sans-serif;
    --font-condensed:     "Trade Gothic Next LT Pro Condensed", "Arial Narrow", sans-serif;
  }

  html, body { margin: 0; padding: 0; }
  html { background: var(--page-bg); }
  body {
    background: var(--page-bg);
    color: var(--rci-ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    position: relative;
  }
  #root { position: relative; z-index: 1; }

  .site {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 28px 64px;
  }

  .rci-header, .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    background: var(--page-bg);
  }

  /* ─── MASTHEAD ────────────────────────────────────────────── */
  .masthead { border-bottom: 1px solid var(--rule-soft); }
  .mast-inner {
    max-width: 1320px; margin: 0 auto; padding: 10px 28px;
    display: flex; justify-content: space-between; align-items: center; gap: 24px; box-sizing: border-box;
  }
  .mast-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; flex: 1 1 auto; min-width: 0; }
  .mast-logo { width: 38px; height: 38px; display: block; }
  .mast-brand-text { display: flex; flex-direction: column; justify-content: flex-end; }
  .mast-brand-pre {
    font-family: var(--font-serif); font-style: italic; font-size: 13px; line-height: 1.1;
    color: var(--rci-ink-soft); text-transform: none; margin-bottom: 1px;
  }
  .mast-brand-name {
    font-family: var(--font-condensed); font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em;
    font-size: 22px; line-height: 0.95; white-space: nowrap; color: var(--rci-ink);
  }
  .mast-right { display: flex; align-items: center; gap: 18px; }
  .mast-lang {
    font-family: var(--font-condensed); text-transform: uppercase; letter-spacing: 0.1em; font-size: 12px;
    color: var(--rci-ink-soft); background: none; border: 0; padding: 0; cursor: pointer;
  }
  .mast-lang:hover { color: var(--rci-red); }
  .menu-drawer-brand .mast-brand-name { font-size: 23px; letter-spacing: 0.02em; }

  /* ─── NAV ─────────────────────────────────────────────────── */
  .primary-nav { border-bottom: 4px solid var(--rule); }
  .nav-inner {
    max-width: 1320px; margin: 0 auto; padding: 0 28px; box-sizing: border-box;
    display: flex; gap: 0; flex-wrap: wrap; align-items: stretch;
  }
  .nav-menu-btn {
    display: inline-flex; align-items: center; gap: 11px; flex: 0 0 auto;
    font-family: var(--font-condensed); font-weight: 700; font-size: 15px; letter-spacing: 0.12em;
    text-transform: uppercase; padding: 10px 28px; background: none; color: var(--rci-ink);
    border: 0; border-right: 1px solid var(--rule-soft); cursor: pointer; transition: color 90ms;
  }
  .nav-menu-btn:first-child { padding-left: 0; }
  .nav-menu-btn:hover { color: var(--rci-red); }
  .nav-menu-icon { width: 24px; height: 24px; display: block; }
  .nav-menu-label { line-height: 1; }
  .nav-link {
    position: relative; display: inline-flex; align-items: center; flex: 0 0 auto;
    font-family: var(--font-condensed); font-weight: 700; font-size: 15px; letter-spacing: 0.11em;
    text-transform: uppercase; color: var(--rci-ink); text-decoration: none; padding: 10px 26px;
    border-right: 1px solid var(--rule-soft); transition: color 90ms;
  }
  .nav-link:hover { color: var(--rci-red); }
  .nav-link.is-active { color: var(--rci-ink); }
  .nav-link.is-active::after {
    content: ""; position: absolute; left: 26px; right: 26px; bottom: 5px; height: 3px; background: var(--rci-red);
  }
  @media (max-width: 540px) {
    .nav-menu-label { display: none; }
    .nav-menu-btn { padding: 15px 18px; }
    .nav-link { padding: 15px 16px; font-size: 13px; }
    .nav-link.is-active::after { left: 16px; right: 16px; }
  }

    /* ─── FOOTER ─────────────────────────────────────────────── */
  .site-foot {
    margin-top: 60px;
    padding: 40px 0 44px;
    border-top: 4px solid var(--rule);
    position: relative;
  }
  .foot-main {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 48px;
    align-items: center;
  }
  .foot-brand { display: flex; gap: 16px; align-items: center; }
  .foot-brand img { width: 58px; height: 58px; }
  .foot-brand-wm {
    font-family: var(--font-article-title);
    font-weight: 700;
    font-size: 28px;
    line-height: 1.04;
    color: var(--fg, var(--rci-ink));
    max-width: 14ch;
  }

  /* Right column — stacked links */
  .foot-right {
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--rule-soft);
    padding-left: 44px;
  }
  .foot-link {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 25px;
    line-height: 1.15;
    letter-spacing: -0.005em;
    color: var(--fg, var(--rci-ink));
    text-decoration: none;
    padding: 18px 0;
    border-bottom: 1px dashed var(--rule-soft);
    transition: color 90ms, padding-left 90ms;
  }
  .foot-link:first-child { padding-top: 0; }
  .foot-link:last-child { border-bottom: 0; }
  .foot-link:hover { color: var(--rci-red); padding-left: 6px; }

  @media (max-width: 760px) {
    
    
  }

  /* ════════════════════════════════════════════════════════════
     CATEGORY / SUBJECT LANDING PAGE — Theory: Marxist Economics
     ════════════════════════════════════════════════════════════ */

  /* ── Category Hero ────────────────────────────────────────── */
  .cat-hero {
    display: grid;
    grid-template-columns: 460px 1fr;
    gap: 48px;
    align-items: start;
    padding: 32px 0 44px;
    border-bottom: 1px solid var(--rule-soft);
  }
  .cat-hero-figure {
    position: relative;
    border: 2px solid var(--rule);
    background: var(--rci-ink);
    aspect-ratio: 4/3;
    overflow: hidden;
  }
  .cat-hero-figure img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cat-hero-stamp {
    position: absolute;
    top: 12px;
    left: 12px;
    background: var(--rci-red);
    color: var(--rci-offwhite);
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 6px 12px 4px;
    line-height: 1;
    z-index: 2;
  }
  .cat-hero-body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
  }
  .cat-hero-eyebrow {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rci-red);
    margin-bottom: 8px;
  }
  .cat-hero-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: clamp(36px, 5vw, 64px);
    line-height: 0.95;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
    color: var(--rci-ink);
    text-transform: none;
  }
  .cat-hero-intro {
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.5;
    color: var(--rci-ink-soft);
    margin: 0 0 24px;
    max-width: 60ch;
  }
  .cat-hero-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .cat-tag {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--rci-ink-soft);
    background: var(--paper-soft);
    border: 1px solid var(--rule-soft);
    padding: 5px 10px 4px;
  }

  /* ── Editor's Picks ────────────────────────────────────────── */
  .picks {
    padding: 36px 0;
    border-bottom: 1px solid var(--rule-soft);
  }
  .picks-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 48px;
    align-items: start;
    margin-top: 18px;
  }
  .picks-lead {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
  }
  .picks-lead-img {
    position: relative;
    aspect-ratio: 16/9;
    border: 2px solid var(--rule);
    background: var(--rci-ink);
    overflow: hidden;
    margin-bottom: 14px;
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1);
  }
  .picks-lead:hover .picks-lead-img {
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0 var(--rule);
  }
  .picks-lead-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 32px;
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 8px 0 10px;
    color: var(--rci-ink);
  }
  .picks-lead:hover .picks-lead-title {
    color: var(--rci-red);
  }
  .picks-lead-dek {
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
    color: var(--rci-ink-soft);
    margin: 0 0 14px;
  }
  .picks-lead-byline {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--rci-ash);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .picks-lead-byline .dot {
    color: var(--rci-hairline-2);
  }

  .picks-side {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .picks-side li {
    border-bottom: 1px dashed var(--rule-soft);
    padding-bottom: 20px;
  }
  .picks-side li:last-child {
    border-bottom: 0;
    padding-bottom: 0;
  }
  .picks-side-row {
    display: flex;
    gap: 20px;
    text-decoration: none;
    color: inherit;
    align-items: start;
  }
  .picks-side-img {
    position: relative;
    width: 130px;
    aspect-ratio: 4/3;
    border: 2px solid var(--rule);
    background: var(--rci-ink);
    overflow: hidden;
    flex-shrink: 0;
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1);
  }
  .picks-side-row:hover .picks-side-img {
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0 var(--rule);
  }
  .picks-side-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .picks-side-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 19px;
    line-height: 1.15;
    margin: 4px 0 6px;
    color: var(--rci-ink);
  }
  .picks-side-row:hover .picks-side-title {
    color: var(--rci-red);
  }
  .picks-side-author {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--rci-ash);
  }

  /* ── PhotoOrSlab helpers ────────────────────────────────────── */
  .ph-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: contrast(1.05) saturate(0.95);
    transition: transform 120ms cubic-bezier(0.2,0.7,0.1,1);
  }
  .ph-grain {
    position: absolute;
    inset: 0;
    background-size: 500px;
    mix-blend-mode: multiply;
    opacity: 0.14;
    pointer-events: none;
  }
  .ph-slab {
    position: absolute;
    inset: 0;
    background: var(--rci-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    text-align: center;
    color: var(--rci-offwhite);
  }
  .ph-slab span {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    line-height: 1.1;
    text-wrap: balance;
  }

  /* ── Marxist University ─────────────────────────────────────── */
  .muni {
    padding: 36px 0;
    border-bottom: 1px solid var(--rule-soft);
  }
  .muni-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    margin-top: 18px;
  }
  .muni-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--paper);
    border: 2px solid var(--rule);
    padding: 16px;
    text-decoration: none;
    color: inherit;
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms;
  }
  .muni-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0 var(--rule);
  }
  .muni-card-img {
    position: relative;
    aspect-ratio: 16/10;
    border: 1.5px solid var(--rule);
    background: var(--rci-ink);
    overflow: hidden;
  }
  .muni-card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: contrast(1.05) saturate(0.95);
  }
  .muni-card-level {
    position: absolute;
    bottom: 8px;
    left: 8px;
    background: var(--rci-ink);
    color: var(--rci-offwhite);
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 8px 3px;
    line-height: 1;
    z-index: 2;
  }
  .muni-card-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 21px;
    line-height: 1.15;
    margin: 0;
    color: var(--rci-ink);
  }
  .muni-card:hover .muni-card-title {
    color: var(--rci-red);
  }
  .muni-card-blurb {
    font-family: var(--font-serif);
    font-size: 14.5px;
    line-height: 1.45;
    color: var(--rci-ink-soft);
    margin: 0;
  }

  /* ── WellRed Books Recommends ───────────────────────────────── */
  .wrr {
    padding: 36px 0;
    border-bottom: 1px solid var(--rule-soft);
  }
  .wrr-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    margin-top: 18px;
  }
  .wrr-book {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 24px;
    background: var(--paper);
    border: 2px solid var(--rule);
    padding: 20px;
    text-decoration: none;
    color: inherit;
    align-items: start;
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms;
  }
  .wrr-book:hover {
    transform: translate(-2px, -2px);
    box-shadow: 4px 4px 0 var(--rule);
  }
  .wrr-cover {
    position: relative;
    aspect-ratio: 3/4;
    border: 1.5px solid var(--rule);
    background: var(--rci-ink);
    overflow: hidden;
  }
  .wrr-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .wrr-body {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .wrr-title {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 22px;
    line-height: 1.1;
    margin: 0;
    color: var(--rci-ink);
  }
  .wrr-book:hover .wrr-title {
    color: var(--rci-red);
  }
  .wrr-meta {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--rci-ash);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .wrr-meta .dot {
    color: var(--rci-hairline-2);
  }
  .wrr-desc {
    font-family: var(--font-body);
    font-size: 14.5px;
    line-height: 1.45;
    color: var(--rci-ink-soft);
    margin: 0 0 4px;
  }
  .wrr-buy {
    font-family: var(--font-condensed);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--rci-red);
  }

  /* ── Browse Filter Feed ─────────────────────────────────────── */
  .browse { padding: 36px 0 12px; }
  .browse-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 4px solid var(--rule);
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .browse-head h2 { margin: 0; }
  .browse-section-head {
    border-bottom: 0 !important;
    padding-bottom: 0 !important;
  }
  .sortbar { display: inline-flex; align-items: center; gap: 10px; }
  .sortbar-label {
    font-family: var(--font-condensed); font-weight: 700; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--rci-ash);
  }
  .sortbar .fselect-wrap { min-width: 150px; }
  .sortbar .fselect { padding: 9px 36px 8px 12px; font-size: 12px; }

  .browse-grid { display: grid; grid-template-columns: 256px 1fr; gap: 0; margin-top: 26px; }
  .browse-rail { padding-right: 30px; }
  .browse-results { border-left: 1px solid var(--rule-soft); padding-left: 36px; min-width: 0; }

  /* Search bar mini */
  .searchbar.mini {
    position: relative; display: flex; align-items: stretch;
    background: var(--paper); border: 2px solid var(--rci-ink);
    height: 44px;
    margin-bottom: 24px;
  }
  .searchbar.mini .searchbar-icon {
    flex: 0 0 auto; width: 44px; display: flex; align-items: center; justify-content: center;
    color: var(--rci-red); border-right: 2px solid var(--rci-ink); background: var(--paper-soft);
  }
  .searchbar.mini .searchbar-icon svg { width: 18px; height: 18px; display: block; }
  .searchbar.mini .searchbar-input {
    flex: 1 1 auto; min-width: 0; border: 0; background: transparent; outline: none;
    font-family: var(--font-serif); font-size: 16px; font-weight: 700;
    color: var(--rci-ink); padding: 10px 12px; height: 40px; box-sizing: border-box;
  }
  .searchbar.mini .searchbar-input::placeholder { color: var(--rci-ash); font-style: italic; opacity: 0.75; }
  .searchbar.mini .searchbar-clear {
    flex: 0 0 auto; align-self: center; margin-right: 8px; width: 24px; height: 24px;
    border: 1.5px solid var(--rci-ink); background: var(--paper); color: var(--rci-ink);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 90ms, color 90ms, transform 90ms;
  }
  .searchbar.mini .searchbar-clear:hover { background: var(--rci-ink); color: var(--rci-offwhite); }
  .searchbar.mini .searchbar-clear svg { width: 10px; height: 10px; display: block; }

  /* Filters */
  .fgroup { margin-bottom: 28px; }
  .fgroup-head {
    font-family: var(--font-condensed); font-weight: 800; font-size: 13px;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--rci-ink);
    border-bottom: 2px solid var(--rci-ink); padding-bottom: 7px; margin-bottom: 12px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  .fcheck { display: flex; align-items: center; gap: 12px; padding: 7px 0; cursor: pointer; user-select: none; }
  .fcheck input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
  .fcheck-box {
    flex: 0 0 auto; width: 20px; height: 20px; border: 2px solid var(--rci-ink);
    background: var(--paper); display: flex; align-items: center; justify-content: center;
    transition: background 90ms, border-color 90ms;
  }
  .fcheck-box svg {
    width: 13px; height: 13px; color: var(--rci-offwhite); opacity: 0; transform: scale(0.4);
    transition: opacity 90ms, transform 130ms cubic-bezier(0.2,0.7,0.1,1);
  }
  .fcheck input:checked + .fcheck-box { background: var(--rci-red); border-color: var(--rci-red); }
  .fcheck input:checked + .fcheck-box svg { opacity: 1; transform: scale(1); }
  .fcheck-label {
    font-family: var(--font-serif); font-weight: 700; font-size: 19px; line-height: 1.08;
    color: var(--rci-ink); transition: color 90ms;
  }
  .fcheck:hover .fcheck-label { color: var(--rci-red); }
  .fcheck.sm { padding: 5px 0; gap: 11px; }
  .fcheck.sm .fcheck-box { width: 17px; height: 17px; }
  .fcheck.sm .fcheck-label {
    font-family: var(--font-condensed); font-weight: 700; font-size: 14px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .fselect-wrap { position: relative; }
  .fselect {
    width: 100%; box-sizing: border-box; appearance: none; -webkit-appearance: none;
    font-family: var(--font-condensed); font-weight: 700; font-size: 13px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--rci-ink); background: var(--paper);
    border: 2px solid var(--rci-ink); padding: 13px 40px 12px 14px; cursor: pointer;
    transition: box-shadow 90ms cubic-bezier(0.2,0.7,0.1,1), background 90ms, color 90ms;
  }
  .fselect:hover, .fselect:focus { outline: none; }
  .fselect[data-active="true"] { background: var(--rci-ink); color: var(--rci-offwhite); }
  .fselect-wrap::after {
    content: "▾"; position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
    color: var(--rci-red); pointer-events: none; font-size: 13px; font-weight: 700;
  }

  .browse-rail-foot {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 12px;
    border-top: 1.5px solid var(--rule-soft);
    padding-top: 18px;
  }
  .fclear {
    align-self: flex-start;
    font-family: var(--font-condensed); font-weight: 700; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--rci-red); background: transparent; border: 0;
    padding: 0 0 2px; cursor: pointer; border-bottom: 2px solid var(--rci-red);
    transition: color 90ms, border-color 90ms; line-height: 1;
  }
  .fclear:hover { color: var(--rci-red-dark); border-color: var(--rci-red-dark); }
  .fclear:disabled { color: var(--rci-ash); border-color: transparent; cursor: default; }
  .browse-rail-search {
    font-family: var(--font-condensed); font-weight: 700; font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--rci-ink-soft); text-decoration: none;
    transition: color 90ms;
  }
  .browse-rail-search:hover { color: var(--rci-red); }

  /* Results feed */
  .result-list { display: flex; flex-direction: column; }
  .result {
    display: grid; grid-template-columns: 212px 1fr; gap: 26px; padding: 26px 0;
    border-bottom: 1px dashed var(--rule-soft); align-items: start;
    text-decoration: none; color: inherit; position: relative;
  }
  .result:first-child { padding-top: 22px; }
  .result-thumb {
    position: relative; width: 100%; aspect-ratio: 4/3; border: 2px solid var(--rci-ink);
    overflow: hidden; background: var(--rci-ink);
    transition: transform 120ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 120ms cubic-bezier(0.2,0.7,0.1,1);
  }
  .result:hover .result-thumb { transform: translate(-2px, -2px); }
  .result-thumb-img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: contrast(1.05) saturate(0.95); display: block;
  }
  .result-thumb-grain {
    position: absolute; inset: 0; background-size: 480px; mix-blend-mode: multiply;
    opacity: 0.13; pointer-events: none;
  }
  .result-slab {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 12px; text-align: center;
  }
  .result-slab span {
    font-family: var(--font-display); font-weight: 700; color: var(--rci-offwhite);
    font-size: 15px; line-height: 1; text-transform: uppercase; letter-spacing: 0.03em;
    text-wrap: balance; position: relative; z-index: 2;
  }
  .result-slab::after {
    content: ""; position: absolute; inset: 8px; border: 1px solid rgba(255,255,255,0.22); pointer-events: none;
  }
  .result-index {
    position: absolute; top: -2px; left: -2px; z-index: 3;
    font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: 0.04em;
    color: var(--rci-offwhite); background: var(--rci-ink); padding: 4px 9px 3px;
    transition: background 100ms;
  }
  .result:hover .result-index { background: var(--rci-red); }

  .result-body { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .result-kicker {
    font-family: var(--font-condensed); font-weight: 700; font-size: 12.5px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--rci-red); display: inline-flex; align-items: center; gap: 9px;
  }
  .result-kicker .sep { color: var(--rci-hairline-2); font-weight: 700; }
  .result-title {
    font-family: var(--font-serif); font-weight: 700; font-size: 27px; line-height: 1.07;
    letter-spacing: -0.01em; text-transform: none; color: var(--rci-ink); margin: 0;
    transition: color 90ms; text-wrap: pretty;
  }
  .result:hover .result-title { color: var(--rci-red); }
  .result-synopsis {
    font-family: var(--font-serif); font-size: 16px; line-height: 1.45; color: var(--rci-ink-soft);
    margin: 0; max-width: 64ch;
  }
  .result-foot { display: flex; align-items: center; gap: 12px; margin-top: 3px; flex-wrap: wrap; }
  .result-author {
    font-family: var(--font-condensed); font-weight: 700; font-size: 12px; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--rci-ink);
  }
  .result-dot { color: var(--rci-hairline-2); }
  .result-date {
    font-family: var(--font-condensed); font-weight: 700; font-size: 12px; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--rci-ash); font-variant-numeric: tabular-nums;
  }
  .result-lang {
    margin-left: auto; font-family: var(--font-condensed); font-weight: 700; font-size: 10px;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--rci-ash);
    border: 1.5px solid var(--rule-soft); padding: 3px 7px 2px;
  }

  /* Empty state */
  .empty {
    border: 2px dashed var(--rule); background: var(--paper-soft); padding: 52px 30px;
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px;
    margin-top: 24px;
  }
  .empty-stamp {
    font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 0.95;
    color: var(--rci-red); text-transform: uppercase; letter-spacing: 0.02em;
    border: 3px solid var(--rci-red); padding: 10px 18px 8px; transform: rotate(-2.5deg);
  }
  .empty-msg { font-family: var(--font-serif); font-style: italic; font-size: 18px; color: var(--rci-ink-soft); max-width: 48ch; margin: 0; }

  /* Pagination */
  .pager { display: flex; align-items: center; justify-content: center; gap: 9px; padding: 38px 0 12px; flex-wrap: wrap; }
  .pager-btn {
    font-family: var(--font-display); font-weight: 700; font-size: 18px; min-width: 44px; height: 44px;
    padding: 0 13px; display: inline-flex; align-items: center; justify-content: center;
    border: 2px solid var(--rci-ink); background: var(--paper); color: var(--rci-ink); cursor: pointer; text-decoration: none;
    transition: transform 80ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 80ms, background 80ms, color 80ms;
    font-variant-numeric: tabular-nums;
  }
  .pager-btn:hover:not(:disabled):not(.is-active) { background: var(--rci-ink); color: var(--rci-offwhite); }
  .pager-btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--rci-ink); }
  .pager-btn.is-active { background: var(--rci-red); border-color: var(--rci-red); color: var(--rci-offwhite); }
  .pager-btn:disabled { opacity: 0.32; cursor: not-allowed; box-shadow: none; }
  .pager-btn.arrow { font-size: 22px; line-height: 1; }
  .pager-ellipsis { font-family: var(--font-display); font-size: 18px; color: var(--rci-ash); padding: 0 2px; }

  /* ── Responsive media queries ───────────────────────────────── */
  @media (max-width: 900px) {
    .cat-hero { grid-template-columns: 1fr; gap: 24px; }
    .picks-grid { grid-template-columns: 1fr; gap: 32px; }
    .muni-grid { grid-template-columns: 1fr; }
    .wrr-grid { grid-template-columns: 1fr; }
    .browse-grid { grid-template-columns: 1fr; }
    .browse-results { border-left: 0; padding-left: 0; }
    .browse-rail { padding-right: 0; border-bottom: 3px solid var(--rule); margin-bottom: 26px; padding-bottom: 24px; }
  }
  @media (max-width: 560px) {
    .wrr-book { grid-template-columns: 1fr; }
    .wrr-cover { max-width: 150px; }
    .result { grid-template-columns: 118px 1fr; gap: 16px; padding: 22px 0; }
    .result-title { font-size: 21px; }
    .result-synopsis { font-size: 15px; }
    .result-index { font-size: 12px; padding: 3px 7px 2px; }
  }
</style>
