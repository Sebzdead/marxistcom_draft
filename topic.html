<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Marxist Economics — Marxist.com</title>

<link rel="stylesheet" href="ds/colors_and_type.css">
<link rel="stylesheet" href="ds/rci-web.css">

<style>
  :root {

    /* Bridge: legacy token names used by the inline CSS + components.jsx,
       remapped onto warm surfaces so nothing reads cool/grey. */
    --rci-offwhite:   var(--rci-paper-card);
    --rci-fog:        var(--rci-hairline-2);
    --page-bg:        var(--rci-paper);
    --page-bg-dark:   var(--rci-paper);
    --paper:          var(--rci-paper-card);
    --paper-soft:     var(--rci-paper-deep);
    --rule:           var(--rci-ink);
    --rule-soft:      var(--rci-hairline-2);
    --fg:             var(--rci-ink);
    --fg-soft:        var(--rci-ink-soft);

    --font-body:          "Cheltenham BT", "Georgia", "Times New Roman", serif;
    --font-serif:         "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-serif-body:    "Cheltenham BT", "Georgia", "Times New Roman", serif;
    --font-article-title: "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-headline:      "Cormorant Garamond", "Cheltenham BT", "Georgia", serif;
    --font-display:       "Built Titling", "Trade Gothic Next LT Pro", "Arial Narrow", sans-serif;
    --font-condensed:     "Trade Gothic Next LT Pro Condensed", "Arial Narrow", sans-serif;
  }

  html, body { margin: 0; padding: 0; }
  html { background: var(--page-bg); }
  body {
    background: var(--page-bg);
    color: var(--rci-ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    position: relative;
  }
  #root { position: relative; z-index: 1; }

  .site {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 28px 64px;
  }

  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    background: var(--page-bg);
  }

  /* ─── MASTHEAD ────────────────────────────────────────────── */
  .masthead { border-bottom: 1px solid var(--rule-soft); }
  .mast-inner {
    max-width: 1320px; margin: 0 auto; padding: 10px 28px;
    display: flex; justify-content: space-between; align-items: center; gap: 24px; box-sizing: border-box;
  }
  .mast-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; flex: 1 1 auto; min-width: 0; }
  .mast-logo { width: 38px; height: 38px; display: block; }
  .mast-brand-text { display: flex; flex-direction: column; justify-content: flex-end; }
  .mast-brand-pre {
    font-family: var(--font-serif); font-style: italic; font-size: 13px; line-height: 1.1;
    color: var(--rci-ink-soft); text-transform: none; margin-bottom: 1px;
  }
  .mast-brand-name {
    font-family: var(--font-condensed); font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em;
    font-size: 22px; line-height: 0.95; white-space: nowrap; color: var(--rci-ink);
  }
  .mast-right { display: flex; align-items: center; gap: 18px; }
  .mast-lang {
    font-family: var(--font-condensed); text-transform: uppercase; letter-spacing: 0.1em; font-size: 12px;
    color: var(--rci-ink-soft); background: none; border: 0; padding: 0; cursor: pointer;
  }
  .mast-lang:hover { color: var(--rci-red); }
  .menu-drawer-brand .mast-brand-name { font-size: 23px; letter-spacing: 0.02em; }

  /* ─── NAV ─────────────────────────────────────────────────── */
  .primary-nav { border-bottom: 4px solid var(--rule); }
  .nav-inner {
    max-width: 1320px; margin: 0 auto; padding: 0 28px; box-sizing: border-box;
    display: flex; gap: 0; flex-wrap: wrap; align-items: stretch;
  }
  .nav-menu-btn {
    display: inline-flex; align-items: center; gap: 11px; flex: 0 0 auto;
    font-family: var(--font-condensed); font-weight: 700; font-size: 15px; letter-spacing: 0.12em;
    text-transform: uppercase; padding: 10px 28px; background: none; color: var(--rci-ink);
    border: 0; border-right: 1px solid var(--rule-soft); cursor: pointer; transition: color 90ms;
  }
  .nav-menu-btn:first-child { padding-left: 0; }
  .nav-menu-btn:hover { color: var(--rci-red); }
  .nav-menu-icon { width: 24px; height: 24px; display: block; }
  .nav-menu-label { line-height: 1; }
  .nav-link {
    position: relative; display: inline-flex; align-items: center; flex: 0 0 auto;
    font-family: var(--font-condensed); font-weight: 700; font-size: 15px; letter-spacing: 0.11em;
    text-transform: uppercase; color: var(--rci-ink); text-decoration: none; padding: 10px 26px;
    border-right: 1px solid var(--rule-soft); transition: color 90ms;
  }
  .nav-link:hover { color: var(--rci-red); }
  .nav-link.is-active { color: var(--rci-ink); }
  .nav-link.is-active::after {
    content: ""; position: absolute; left: 26px; right: 26px; bottom: 5px; height: 3px; background: var(--rci-red);
  }
  @media (max-width: 540px) {
    .nav-menu-label { display: none; }
    .nav-menu-btn { padding: 15px 18px; }
    .nav-link { padding: 15px 16px; font-size: 13px; }
    .nav-link.is-active::after { left: 16px; right: 16px; }
  }

  /* ─── FOOTER ─────────────────────────────────────────────── */
  .site-foot { margin-top: 60px; padding: 40px 0 44px; border-top: 4px solid var(--rule); position: relative; }
  .foot-main { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 48px; align-items: center; }
  .foot-brand { display: flex; gap: 16px; align-items: center; }
  .foot-brand img { width: 58px; height: 58px; }
  .foot-brand-wm {
    font-family: var(--font-article-title); font-weight: 700; font-size: 28px; line-height: 1.04;
    color: var(--fg, var(--rci-ink)); max-width: 14ch;
  }
  .foot-manifesto-card { display: block; justify-self: center; width: 100%; max-width: 300px; text-decoration: none; }
  .foot-manifesto-img {
    width: 100%; aspect-ratio: 3 / 2; overflow: hidden; border: 2px solid var(--rule); background: var(--rci-ink);
    transition: transform 90ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 90ms;
  }
  .foot-manifesto-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foot-right { display: flex; flex-direction: column; border-left: 1px solid var(--rule-soft); padding-left: 44px; }
  .foot-link {
    font-family: var(--font-serif); font-weight: 700; font-size: 25px; line-height: 1.15; letter-spacing: -0.005em;
    color: var(--fg, var(--rci-ink)); text-decoration: none; padding: 18px 0;
    border-bottom: 1px dashed var(--rule-soft); transition: color 90ms, padding-left 90ms;
  }
  .foot-link:first-child { padding-top: 0; }
  .foot-link:last-child { border-bottom: 0; }
  .foot-link:hover { color: var(--rci-red); padding-left: 6px; }

  /* ─── DRAWER ─────────────────────────────────────────────── */
  .menu-drawer-overlay {
    position: fixed; inset: 0; background: rgba(34, 28, 23, 0.12);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    z-index: 2000; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto;
  }
  .menu-drawer {
    width: 100%; min-height: auto; background: var(--paper); border-bottom: 4px solid var(--rule);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15); display: flex; flex-direction: column; padding: 0; box-sizing: border-box;
    transform: translateY(-20px); opacity: 0; animation: slideDownDrawer 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    position: relative; z-index: 2001;
  }
  @keyframes slideDownDrawer { to { transform: translateY(0); opacity: 1; } }
  .menu-drawer-inner {
    width: 100%; max-width: 1200px; margin: 0 auto; padding: 22px 24px 30px;
    display: flex; flex-direction: column; gap: 20px; box-sizing: border-box;
  }
  .menu-drawer-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid var(--rule); padding-bottom: 12px;
  }
  .menu-drawer-brand { display: flex; align-items: center; gap: 10px; }
  .menu-drawer-brand img { width: 32px; height: 32px; display: block; }
  .menu-drawer-search {
    display: flex; align-items: center; gap: 14px; border: 2px solid var(--rule);
    background: var(--paper-soft); padding: 14px 18px;
  }
  .menu-drawer-search svg { width: 24px; height: 24px; flex: 0 0 auto; color: var(--rci-ink); }
  .menu-drawer-search-input {
    flex: 1 1 auto; min-width: 0; border: 0; background: transparent; outline: none;
    font-family: var(--font-body); font-size: 21px; letter-spacing: 0.01em; color: var(--rci-ink);
  }
  .menu-drawer-search-input::placeholder { color: var(--rci-ink); opacity: 0.5; font-style: italic; }
  .menu-drawer-close {
    width: 36px; height: 36px; border: 2px solid var(--rule); background: transparent; color: var(--rci-ink);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 90ms, color 90ms, transform 90ms cubic-bezier(0.2,0.7,0.1,1); padding: 0;
  }
  .menu-drawer-close:hover { background: var(--rci-ink); color: var(--rci-offwhite); }
  .menu-drawer-close svg { width: 18px; height: 18px; display: block; }
  .menu-drawer-layout { display: flex; gap: 36px; width: 100%; }
  .menu-drawer-sidebar {
    width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px;
    border-right: 2px solid var(--rule-soft); padding-right: 28px;
  }
  .menu-drawer-categories { flex-grow: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 36px; }
  .drawer-sidebar-item {
    display: flex; gap: 13px; text-decoration: none; color: var(--rci-ink); padding: 9px 12px;
    border: 2px solid transparent; transition: all 120ms; align-items: center;
  }
  .drawer-sidebar-item:hover {
    background: var(--paper-soft); border-color: var(--rule-soft);
    transform: translate(2px, -2px);
  }
  .drawer-sidebar-item svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.75; flex-shrink: 0; }
  .drawer-sidebar-item-content { display: flex; flex-direction: column; gap: 4px; }
  .drawer-sidebar-item-title {
    font-family: var(--font-article-title); font-size: 19px; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em;
  }
  .drawer-category { display: flex; flex-direction: column; gap: 9px; }
  .drawer-category-title {
    font-family: var(--font-condensed); font-weight: 800; font-size: 14.5px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--rci-red); border-bottom: 1.5px solid var(--rci-red);
    padding-bottom: 4px; margin-bottom: 2px;
  }
  .drawer-category-links { display: flex; flex-direction: column; gap: 6px; }
  .drawer-category-link {
    font-family: var(--font-article-title); font-size: 17.5px; font-weight: 700; text-decoration: none;
    color: var(--rci-ink); transition: color 90ms, padding-left 90ms; display: inline-flex; align-items: center;
  }
  .drawer-category-link:hover { color: var(--rci-red); padding-left: 6px; }
  .drawer-category-link::before { content: "·"; margin-right: 6px; opacity: 0.5; font-weight: bold; }
  .drawer-category-link:hover::before { content: "→"; color: var(--rci-red); opacity: 1; }
  @media (max-width: 900px) {
    .menu-drawer-layout { flex-direction: column; gap: 24px; }
    .menu-drawer-sidebar { width: 100%; border-right: none; border-bottom: 2px solid var(--rule-soft); padding-right: 0; padding-bottom: 16px; }
    .menu-drawer-categories { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) { .menu-drawer-categories { grid-template-columns: 1fr; } }

  /* Shared section heading (ds/rci-web.css uses --rci-font-*; restate with local tokens) */
  .rci-section-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
    border-bottom: 8px solid var(--rci-ink); padding-bottom: 10px; margin-bottom: 22px;
  }
  .rci-section-head h2 {
    font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
    font-size: 30px; letter-spacing: 0.01em; margin: 0; color: var(--rci-ink);
  }
  .rci-section-head a {
    font-family: var(--font-condensed); text-transform: uppercase; letter-spacing: 0.12em;
    font-size: 12px; font-weight: 700; color: var(--rci-red); text-decoration: none; white-space: nowrap;
  }
  .rci-section-head a:hover { color: var(--rci-red-dark); }
  .rci-kicker {
    font-family: var(--font-condensed); font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em;
    font-size: 12px; display: inline-flex; align-items: center; gap: 7px; color: var(--rci-red);
  }
  .rci-kicker::before { content: ""; width: 16px; height: 3px; background: currentColor; }
  .rci-kicker.no-tick::before { display: none; }

  /* Photo / slab helper (shared by hero, picks, university, books, results) */
  .ph-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.05) saturate(0.95); display: block; }
  .ph-grain { position: absolute; inset: 0; background-size: 480px; mix-blend-mode: multiply; opacity: 0.13; pointer-events: none; }
  .ph-slab {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 14px; text-align: center; background: linear-gradient(140deg, var(--rci-red), var(--rci-ink) 78%);
  }
  .ph-slab span {
    font-family: var(--font-display); font-weight: 700; color: var(--rci-offwhite); font-size: 16px;
    line-height: 1; text-transform: uppercase; letter-spacing: 0.03em; text-wrap: balance; position: relative; z-index: 2;
  }
  .ph-slab::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(255,255,255,0.22); pointer-events: none; }

  /* ════════════════════════════════════════════════════════════
     CATEGORY HERO
     ════════════════════════════════════════════════════════════ */
  .cat-hero {
    display: grid; grid-template-columns: 300px 1fr; gap: 44px; align-items: center;
    padding: 40px 0 38px; border-bottom: 8px solid var(--rci-ink); margin-bottom: 8px;
  }
  .cat-hero-figure {
    position: relative; aspect-ratio: 1/1; background: var(--paper-soft);
    border: 2px solid var(--rci-ink); display: flex; align-items: center; justify-content: center;
  }
  .cat-hero-figure img { width: 100%; height: 100%; object-fit: contain; padding: 22px; box-sizing: border-box; display: block; }
  .cat-hero-stamp {
    position: absolute; top: -16px; left: -16px; z-index: 2;
    font-family: var(--font-condensed); font-weight: 700; font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--rci-offwhite); background: var(--rci-ink);
    padding: 7px 12px 6px; transform: rotate(-3deg);
  }
  .cat-hero-eyebrow {
    font-family: var(--font-condensed); font-weight: 700; font-size: 13px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--rci-red);
  }
  .cat-hero-title {
    font-family: var(--font-headline); font-weight: 700; font-size: clamp(64px, 9vw, 116px);
    line-height: 0.86; letter-spacing: 0.005em; text-transform: uppercase; color: var(--rci-ink);
    margin: 10px 0 18px;
  }
  .cat-hero-intro {
    font-family: var(--font-serif); font-size: 22px; line-height: 1.42; color: var(--rci-ink-soft);
    max-width: 60ch; margin: 0 0 20px;
  }
  .cat-hero-intro::first-letter {
    float: left; font-family: var(--font-headline); font-weight: 700; font-size: 76px; line-height: 0.66;
    padding: 6px 12px 0 0; color: var(--rci-red);
  }
  .cat-hero-tags { display: flex; flex-wrap: wrap; gap: 9px; }
  .cat-tag {
    font-family: var(--font-condensed); font-weight: 700; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--rci-ink); background: var(--paper-soft);
    border: 1.5px solid var(--rci-ink); padding: 6px 11px 5px;
  }
  @media (max-width: 820px) {
    .cat-hero { grid-template-columns: 1fr; gap: 28px; }
    .cat-hero-figure { max-width: 260px; }
  }

  /* ════════════════════════════════════════════════════════════
     SECTION SPACING
     ════════════════════════════════════════════════════════════ */
  .picks, .muni, .wrr, .browse { padding: 40px 0; }
  .picks { border-bottom: 1px solid var(--rule-soft); }
  .muni { border-bottom: 1px solid var(--rule-soft); }
  .wrr { border-bottom: 8px solid var(--rci-ink); }

  /* ── EDITOR'S PICKS ─────────────────────────────────────────── */
  .picks-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 44px; align-items: start; }
  .picks-lead { text-decoration: none; color: inherit; display: block; }
  .picks-lead-img {
    position: relative; width: 100%; aspect-ratio: 16/10; border: 2px solid var(--rci-ink);
    overflow: hidden; background: var(--rci-ink); margin-bottom: 14px;
    transition: transform 120ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 120ms cubic-bezier(0.2,0.7,0.1,1);
  }
  .picks-lead:hover .picks-lead-img { transform: translate(-2px,-2px); }
  .picks-lead-title {
    font-family: var(--font-serif); font-weight: 700; font-size: 38px; line-height: 1.02; letter-spacing: -0.01em;
    color: var(--rci-ink); margin: 8px 0 10px; text-wrap: balance; transition: color 90ms;
  }
  .picks-lead:hover .picks-lead-title { color: var(--rci-red); }
  .picks-lead-dek {
    font-family: var(--font-serif); font-style: italic; font-size: 19px; line-height: 1.4;
    color: var(--rci-ink-soft); margin: 0 0 12px; max-width: 52ch;
  }
  .picks-lead-byline {
    font-family: var(--font-condensed); font-weight: 700; font-size: 12px; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--rci-ash); display: inline-flex; align-items: center; gap: 9px;
  }
  .picks-lead-byline .dot, .wrr-meta .dot { color: var(--rci-hairline-2); }

  .picks-side { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--rci-ink); padding-left: 24px; }
  .picks-side-row {
    display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: center;
    text-decoration: none; color: inherit; padding: 16px 0; border-bottom: 1px dashed var(--rule-soft);
  }
  .picks-side li:first-child .picks-side-row { padding-top: 0; }
  .picks-side li:last-child .picks-side-row { border-bottom: 0; padding-bottom: 0; }
  .picks-side-img {
    position: relative; width: 92px; aspect-ratio: 1/1; border: 1.5px solid var(--rci-ink);
    overflow: hidden; background: var(--rci-ink);
    transition: transform 120ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 120ms;
  }
  .picks-side-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .picks-side-title {
    font-family: var(--font-serif); font-weight: 700; font-size: 20px; line-height: 1.08;
    color: var(--rci-ink); margin: 2px 0 0; transition: color 90ms; text-wrap: pretty;
  }
  .picks-side-row:hover .picks-side-title { color: var(--rci-red); }
  .picks-side-author {
    font-family: var(--font-condensed); font-weight: 700; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--rci-ash);
  }
  @media (max-width: 820px) { .picks-grid { grid-template-columns: 1fr; gap: 28px; } .picks-side { border-left: 0; padding-left: 0; } }

  /* ── MARXIST UNIVERSITY ─────────────────────────────────────── */
  .muni-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .muni-card {
    text-decoration: none; color: inherit; display: flex; flex-direction: column;
    border: 2px solid var(--rci-ink); background: var(--paper); padding: 0 0 18px; transition: transform 120ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 120ms;
  }
  .muni-card:hover { transform: translate(-2px,-2px); }
  .muni-card-img { position: relative; width: 100%; aspect-ratio: 16/9; border-bottom: 2px solid var(--rci-ink); overflow: hidden; background: var(--rci-ink); }
  .muni-card-level {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    font-family: var(--font-condensed); font-weight: 700; font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--rci-offwhite); background: var(--rci-red); padding: 5px 9px 4px;
  }
  .muni-card-title {
    font-family: var(--font-headline); font-weight: 700; font-size: 24px; line-height: 0.96; letter-spacing: 0.01em;
    text-transform: uppercase; color: var(--rci-ink); margin: 16px 18px 8px;
  }
  .muni-card:hover .muni-card-title { color: var(--rci-red); }
  .muni-card-blurb { font-family: var(--font-serif); font-size: 17px; line-height: 1.36; color: var(--rci-ink-soft); margin: 0 18px; }
  @media (max-width: 820px) { .muni-grid { grid-template-columns: 1fr; } }

  /* ── WELLRED BOOKS RECOMMENDS ───────────────────────────────── */
  .wrr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .wrr-book {
    display: grid; grid-template-columns: 150px 1fr; gap: 24px; align-items: start;
    text-decoration: none; color: inherit; padding-left: 24px; border-left: 2px solid var(--rci-ink);
  }
  .wrr-grid .wrr-book:first-child { padding-left: 0; border-left: 0; }
  .wrr-cover {
    position: relative; width: 150px; aspect-ratio: 3/4; border: 2px solid var(--rci-ink);
    overflow: hidden; background: var(--rci-ink);
    transition: transform 120ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 120ms;
  }
  .wrr-book:hover .wrr-cover { transform: translate(-2px,-2px); }
  .wrr-body { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .wrr-title {
    font-family: var(--font-serif); font-weight: 700; font-size: 26px; line-height: 1.04; letter-spacing: -0.01em;
    color: var(--rci-ink); margin: 0; transition: color 90ms;
  }
  .wrr-book:hover .wrr-title { color: var(--rci-red); }
  .wrr-meta {
    font-family: var(--font-condensed); font-weight: 700; font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--rci-ash); display: inline-flex; align-items: center; gap: 9px;
  }
  .wrr-desc { font-family: var(--font-serif); font-size: 17px; line-height: 1.4; color: var(--rci-ink-soft); margin: 4px 0 6px; }
  .wrr-buy {
    font-family: var(--font-condensed); font-weight: 700; font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--rci-red); border-bottom: 2px solid var(--rci-red); padding-bottom: 2px; align-self: flex-start;
  }
  @media (max-width: 820px) {
    .wrr-grid { grid-template-columns: 1fr; gap: 28px; }
    .wrr-book { padding-left: 0; border-left: 0; }
  }

  /* ════════════════════════════════════════════════════════════
     BROWSE — stripped-down Archive widget (shared w/ search page)
     ════════════════════════════════════════════════════════════ */
  .browse-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .browse-section-head { flex: 1 1 auto; margin-bottom: 0; }
  .browse-head .sortbar { padding-bottom: 12px; }
  .sortbar { display: inline-flex; align-items: center; gap: 10px; }
  .sortbar-label {
    font-family: var(--font-condensed); font-weight: 700; font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--rci-ash);
  }
  .sortbar .fselect-wrap { min-width: 170px; }
  .sortbar .fselect { padding-top: 9px; padding-bottom: 8px; font-size: 12px; }

  .browse-grid { display: grid; grid-template-columns: 232px 1fr; gap: 0; margin-top: 26px; }
  .browse-rail { padding-right: 30px; border-right: 1px solid var(--rule-soft); }
  .browse-results { padding-left: 36px; min-width: 0; }
  @media (max-width: 900px) {
    .browse-grid { grid-template-columns: 1fr; }
    .browse-results { padding-left: 0; }
    .browse-rail { padding-right: 0; border-right: 0; border-bottom: 3px solid var(--rci-ink); margin-bottom: 26px; padding-bottom: 18px; }
  }

  /* mini search bar (rail variant of the big searchbar) */
  .searchbar {
    position: relative; display: flex; align-items: stretch; background: var(--paper);
    border: 2px solid var(--rci-ink);
    transition: box-shadow 130ms cubic-bezier(0.2,0.7,0.1,1), transform 130ms cubic-bezier(0.2,0.7,0.1,1);
  }
  .searchbar.mini { margin-bottom: 26px; }
  .searchbar-icon {
    flex: 0 0 auto; width: 46px; display: flex; align-items: center; justify-content: center;
    color: var(--rci-red); border-right: 2px solid var(--rci-ink); background: var(--paper-soft);
  }
  .searchbar-icon svg { width: 20px; height: 20px; display: block; }
  .searchbar-input {
    flex: 1 1 auto; min-width: 0; border: 0; background: transparent; outline: none;
    font-family: var(--font-serif); font-size: 17px; font-weight: 700; letter-spacing: -0.005em;
    color: var(--rci-ink); padding: 12px 12px; height: 48px; box-sizing: border-box;
  }
  .searchbar-input::placeholder { color: var(--rci-ash); font-style: italic; opacity: 0.75; }
  .searchbar-clear {
    flex: 0 0 auto; align-self: center; margin-right: 8px; width: 28px; height: 28px;
    border: 2px solid var(--rci-ink); background: var(--paper); color: var(--rci-ink);
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 90ms, color 90ms, transform 90ms;
  }
  .searchbar-clear:hover { background: var(--rci-ink); color: var(--rci-offwhite); }
  .searchbar-clear svg { width: 13px; height: 13px; display: block; }

  .fgroup { margin-bottom: 26px; }
  .fgroup-head {
    font-family: var(--font-condensed); font-weight: 800; font-size: 13px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--rci-ink); border-bottom: 2px solid var(--rci-ink);
    padding-bottom: 7px; margin-bottom: 12px;
  }
  .fcheck { display: flex; align-items: center; gap: 12px; padding: 6px 0; cursor: pointer; user-select: none; }
  .fcheck input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
  .fcheck-box {
    flex: 0 0 auto; width: 18px; height: 18px; border: 2px solid var(--rci-ink); background: var(--paper);
    display: flex; align-items: center; justify-content: center; transition: background 90ms, border-color 90ms;
  }
  .fcheck-box svg {
    width: 12px; height: 12px; color: var(--rci-offwhite); opacity: 0; transform: scale(0.4);
    transition: opacity 90ms, transform 130ms cubic-bezier(0.2,0.7,0.1,1);
  }
  .fcheck input:checked + .fcheck-box { background: var(--rci-red); border-color: var(--rci-red); }
  .fcheck input:checked + .fcheck-box svg { opacity: 1; transform: scale(1); }
  .fcheck input:focus-visible + .fcheck-box { box-shadow: 0 0 0 3px rgba(212,20,15,0.3); }
  .fcheck.sm .fcheck-label {
    font-family: var(--font-condensed); font-weight: 700; font-size: 14px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--rci-ink); transition: color 90ms;
  }
  .fcheck:hover .fcheck-label { color: var(--rci-red); }

  .fselect-wrap { position: relative; }
  .fselect {
    width: 100%; box-sizing: border-box; appearance: none; -webkit-appearance: none;
    font-family: var(--font-condensed); font-weight: 700; font-size: 13px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--rci-ink); background: var(--paper);
    border: 2px solid var(--rci-ink); padding: 12px 40px 11px 14px; cursor: pointer;
    transition: box-shadow 90ms cubic-bezier(0.2,0.7,0.1,1), background 90ms, color 90ms;
  }
  .fselect:hover, .fselect:focus { outline: none; }
  .fselect[data-active="true"] { background: var(--rci-ink); color: var(--rci-offwhite); }
  .fselect-wrap::after {
    content: "▾"; position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
    color: var(--rci-red); pointer-events: none; font-size: 13px; font-weight: 700;
  }

  .browse-rail-foot { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; border-top: 2px solid var(--rci-ink); padding-top: 16px; }
  .fclear {
    font-family: var(--font-condensed); font-weight: 700; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--rci-red); background: transparent; border: 0; padding: 0 0 2px;
    cursor: pointer; border-bottom: 2px solid var(--rci-red); transition: color 90ms, border-color 90ms; line-height: 1;
  }
  .fclear:hover { color: var(--rci-red-dark); border-color: var(--rci-red-dark); }
  .fclear:disabled { color: var(--rci-ash); border-color: transparent; cursor: default; }
  .browse-rail-search {
    font-family: var(--font-condensed); font-weight: 700; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--rci-ash); text-decoration: none;
  }
  .browse-rail-search:hover { color: var(--rci-ink); }

  /* result rows (identical visual contract to search page) */
  .result-list { display: flex; flex-direction: column; }
  .result {
    display: grid; grid-template-columns: 212px 1fr; gap: 26px; padding: 26px 0;
    border-bottom: 1px dashed var(--rule-soft); align-items: start; text-decoration: none; color: inherit; position: relative;
  }
  .result:first-child { padding-top: 4px; }
  .result-thumb {
    position: relative; width: 100%; aspect-ratio: 4/3; border: 2px solid var(--rci-ink); overflow: hidden;
    background: var(--rci-ink);
    transition: transform 120ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 120ms cubic-bezier(0.2,0.7,0.1,1);
  }
  .result:hover .result-thumb { transform: translate(-2px,-2px); }
  .result-thumb-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.05) saturate(0.95); display: block; }
  .result-thumb-grain { position: absolute; inset: 0; background-size: 480px; mix-blend-mode: multiply; opacity: 0.13; pointer-events: none; }
  .result-slab {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; text-align: center;
    background: linear-gradient(140deg, var(--rci-red), var(--rci-ink) 78%);
  }
  .result-slab span {
    font-family: var(--font-display); font-weight: 700; color: var(--rci-offwhite); font-size: 15px; line-height: 1;
    text-transform: uppercase; letter-spacing: 0.03em; text-wrap: balance; position: relative; z-index: 2;
  }
  .result-slab::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(255,255,255,0.22); pointer-events: none; }
  .result-index {
    position: absolute; top: -2px; left: -2px; z-index: 3; font-family: var(--font-display); font-weight: 700;
    font-size: 14px; letter-spacing: 0.04em; color: var(--rci-offwhite); background: var(--rci-ink); padding: 4px 9px 3px; transition: background 100ms;
  }
  .result:hover .result-index { background: var(--rci-red); }
  .result-body { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .result-kicker {
    font-family: var(--font-condensed); font-weight: 700; font-size: 12.5px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--rci-red); display: inline-flex; align-items: center; gap: 9px;
  }
  .result-kicker .sep { color: var(--rci-hairline-2); font-weight: 700; }
  .result-title {
    font-family: var(--font-serif); font-weight: 700; font-size: 27px; line-height: 1.07; letter-spacing: -0.01em;
    text-transform: none; color: var(--rci-ink); margin: 0; transition: color 90ms; text-wrap: pretty;
  }
  .result:hover .result-title { color: var(--rci-red); }
  .result-synopsis { font-family: var(--font-serif); font-size: 16px; line-height: 1.45; color: var(--rci-ink-soft); margin: 0; max-width: 64ch; }
  .result-foot { display: flex; align-items: center; gap: 12px; margin-top: 3px; flex-wrap: wrap; }
  .result-author {
    font-family: var(--font-condensed); font-weight: 700; font-size: 12px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--rci-ink);
  }
  .result-dot { color: var(--rci-hairline-2); }
  .result-date {
    font-family: var(--font-condensed); font-weight: 700; font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--rci-ash); font-variant-numeric: tabular-nums;
  }
  .result-lang {
    margin-left: auto; font-family: var(--font-condensed); font-weight: 700; font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--rci-ash); border: 1.5px solid var(--rule-soft); padding: 3px 7px 2px;
  }
  @media (max-width: 560px) {
    .result { grid-template-columns: 118px 1fr; gap: 16px; padding: 22px 0; }
    .result-title { font-size: 21px; }
    .result-synopsis { font-size: 15px; }
    .result-index { font-size: 12px; padding: 3px 7px 2px; }
  }

  /* empty state */
  .empty {
    border: 2px dashed var(--rci-ink); background: var(--paper-soft); padding: 52px 30px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 4px;
  }
  .empty-stamp {
    font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 0.95; color: var(--rci-red);
    text-transform: uppercase; letter-spacing: 0.02em; border: 3px solid var(--rci-red); padding: 10px 18px 8px;
    transform: rotate(-2.5deg);
  }
  .empty-msg { font-family: var(--font-serif); font-style: italic; font-size: 18px; color: var(--rci-ink-soft); max-width: 48ch; margin: 0; }

  /* pagination */
  .pager { display: flex; align-items: center; justify-content: center; gap: 9px; padding: 38px 0 6px; flex-wrap: wrap; }
  .pager-btn {
    font-family: var(--font-display); font-weight: 700; font-size: 18px; min-width: 44px; height: 44px; padding: 0 13px;
    display: inline-flex; align-items: center; justify-content: center; border: 2px solid var(--rci-ink);
    background: var(--paper); color: var(--rci-ink); cursor: pointer; text-decoration: none;
    transition: transform 80ms cubic-bezier(0.2,0.7,0.1,1), box-shadow 80ms, background 80ms, color 80ms; font-variant-numeric: tabular-nums;
  }
  .pager-btn:hover:not(:disabled):not(.is-active) { background: var(--rci-ink); color: var(--rci-offwhite); }
  .pager-btn:active:not(:disabled) { transform: translate(3px,3px); box-shadow: 0 0 0 var(--rci-ink); }
  .pager-btn.is-active { background: var(--rci-red); border-color: var(--rci-red); color: var(--rci-offwhite); }
  .pager-btn:disabled { opacity: 0.32; cursor: not-allowed; box-shadow: none; }
  .pager-btn.arrow { font-size: 22px; line-height: 1; }
  .pager-ellipsis { font-family: var(--font-display); font-size: 18px; color: var(--rci-ash); padding: 0 2px; }

</style>
</head>
